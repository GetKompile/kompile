version: 2
# Every non-release DL4J workflow mapped to a CodeBuild target.
# Fields (inline map, one line per target — parsed by scripts/aws/targets-lib.sh):
#   host      — host contract in hosts.sh (environment type, image, fleet, compute)
#   kind      — build | validation
#   variant   — kompile distribution variant passed to build-dist.sh
#   kompile   — whether the target builds the kompile distribution after DL4J
#   image     — optional env-key override for the build image (per-CUDA-version images)
#   compute   — optional per-target compute override (multi-GPU lanes)
#   workflow  — the source GitHub workflow in ../deeplearning4j/.github/workflows
targets:
  linux-x86_64: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-compat: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64-compat.yml}
  linux-arm64: {host: linux-arm64, kind: build, variant: cpu-arm, kompile: true, workflow: build-deploy-linux-arm64.yml}
  macos-arm64: {host: macos-arm64, kind: build, variant: cli-only, kompile: true, workflow: build-deploy-mac-arm64.yml}
  android-arm64: {host: linux-android-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-android-arm64.yml}
  android-x86_64: {host: linux-android-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-android-x86_64.yml}
  cross-linux-x86_64: {host: linux-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-cross-platform.yml}
  cross-linux-arm64: {host: linux-arm64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-cross-platform.yml}
  cross-macosx-arm64: {host: macos-arm64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-cross-platform.yml}
  cross-windows-x86_64: {host: windows-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-cross-platform.yml}
  windows-x86_64: {host: windows-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-windows.yml}
  linux-x86_64-avx2: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-avx512: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-onednn: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-compile: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-onednn-avx2: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-onednn-avx512: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-compile-avx2: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-x86_64-compile-avx512: {host: linux-x86_64, kind: build, variant: cpu-intel, kompile: true, workflow: build-deploy-linux-x86_64.yml}
  linux-cuda-12.9-cudnn: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_12_9_IMAGE, workflow: build-deploy-linux-cuda-12.9.yml}
  linux-cuda-12.9-compile: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_12_9_IMAGE, workflow: build-deploy-linux-cuda-12.9.yml}
  linux-cuda-13.1-cudnn: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_13_1_IMAGE, workflow: build-deploy-linux-cuda-13.1.yml}
  linux-cuda-13.1-compile: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_13_1_IMAGE, workflow: build-deploy-linux-cuda-13.1.yml}
  linux-cuda-13.1: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_13_1_IMAGE, workflow: build-deploy-linux-cuda-13.1.yml}
  linux-cuda-12.9: {host: linux-cuda-x86_64, kind: build, variant: cuda, kompile: true, image: CUDA_12_9_IMAGE, workflow: build-deploy-linux-cuda-12.9.yml}
  windows-cuda-13.1: {host: windows-gpu-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-windows-cuda-13.1.yml}
  windows-cuda-12.9: {host: windows-gpu-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-windows-cuda-12.9.yml}
