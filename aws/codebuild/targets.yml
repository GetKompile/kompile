  android-arm64-vulkan: {host: linux-android-x86_64, kind: build, variant: cli-only, kompile: false, workflow: VULKAN_ANDROID_BUILD.md}
  linux-tpu-pjrt: {host: linux-tpu-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-linux-tpu.yml}
  linux-hexagon: {host: linux-hexagon-x86_64, kind: build, variant: cli-only, kompile: false, workflow: build-deploy-linux-hexagon.yml}
  cpu-sanity-linux: {host: linux-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: cpu-sanity-check-tests.yaml}
  cpu-sanity-windows: {host: windows-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: cpu-sanity-check-tests.yaml}
  cpu-sanity-macos: {host: macos-arm64, kind: validation, variant: cli-only, kompile: false, workflow: cpu-sanity-check-tests.yaml}
  cpu-integration-linux: {host: linux-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-cpu-integration-tests.yml}
  cpu-tests-linux: {host: linux-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-cpu-tests-sanity-checks.yml}
  gpu-tests-linux: {host: linux-gpu-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-gpu-tests-sanity-checks.yml}
  avx512-sde-linux: {host: linux-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-avx512-sde-tests.yml}
  mlx-smoke-macos: {host: macos-arm64, kind: validation, variant: cli-only, kompile: false, workflow: run-mlx-smoke-tests.yml}
  rocm-pjrt-smoke-linux: {host: linux-amd-gpu-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-rocm-pjrt-smoke-tests.yml}
  zluda-java-validation: {host: linux-amd-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: build-zluda-validation.yml}
  zluda-smoke-linux: {host: linux-amd-gpu-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-zluda-smoke-tests.yml}
  tpu-smoke-linux: {host: linux-tpu-hw-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-tpu-smoke-tests.yml}
  hexagon-smoke-linux: {host: linux-hexagon-hw-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-hexagon-smoke-tests.yml}
  vulkan-smoke-linux: {host: linux-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: run-vulkan-smoke-tests.yml}
  gpu-multidevice-linux: {host: linux-gpu-x86_64, kind: validation, variant: cli-only, kompile: false, compute: BUILD_GENERAL1_LARGE, workflow: platform-tests(device-management)}
  test-multiple-cuda-arches: {host: linux-gpu-x86_64, kind: validation, variant: cli-only, kompile: false, workflow: test_multiple_arch.yaml}
  run-tests-matrix: {host: configurable, kind: validation, variant: cli-only, kompile: false, workflow: run-tests.yml}
  kompile-spins: {host: linux-x86_64, kind: build, variant: cli-only, kompile: false, image: SPINS_IMAGE, buildspec: aws/codebuild/buildspec-spins.yml, privileged: true, workflow: kompile-internal}
