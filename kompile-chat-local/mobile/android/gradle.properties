org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx4g
# Three provider classpaths share sources but not native APIs. Recompile Kotlin for
# each release flavor so stale classpath snapshots cannot cross provider builds.
kotlin.incremental=false
