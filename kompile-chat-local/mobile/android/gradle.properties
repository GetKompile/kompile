org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx1g,-XX:MaxMetaspaceSize=512m
# Three provider classpaths share sources but not native APIs. Recompile Kotlin for
# each release flavor so stale classpath snapshots cannot cross provider builds.
kotlin.incremental=false
