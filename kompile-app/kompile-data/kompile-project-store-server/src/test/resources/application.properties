# In-memory DB + temp data dir for tests.
spring.datasource.url=jdbc:h2:mem:pss-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.bytecode.provider=none
kompile.project-store-server.data-dir=${java.io.tmpdir}/kompile-pss-test
kompile.project-store-server.cas-url=http://localhost/xet/cas
kompile.project-store-server.git-base=http://localhost/git
