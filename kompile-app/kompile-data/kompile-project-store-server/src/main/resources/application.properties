# ============================================================
# Kompile Project Store Server
# ============================================================
spring.application.name=kompile-project-store-server
server.port=${PROJECT_STORE_SERVER_PORT:8088}

# Where bare git repos, Xet xorbs/shards live on the local filesystem.
kompile.project-store-server.data-dir=${KOMPILE_PROJECT_STORE_DATA_DIR:${user.home}/.kompile/project-store-server}
# Base URL advertised to Xet clients in the Hub token response (clients append /v1/...).
kompile.project-store-server.cas-url=${KOMPILE_PROJECT_STORE_CAS_URL:http://localhost:8088/xet/cas}
# Base URL used to build git clone URLs in project responses.
kompile.project-store-server.git-base=${KOMPILE_PROJECT_STORE_GIT_BASE:http://localhost:8088/git}
# Reject shard uploads whose term verification hashes don't match the claimed chunk hashes.
kompile.project-store-server.verify-uploads=${KOMPILE_PROJECT_STORE_VERIFY_UPLOADS:true}
# Lifetime (seconds) of a minted CAS token.
kompile.project-store-server.token-ttl-seconds=${KOMPILE_PROJECT_STORE_TOKEN_TTL:3600}
# Secret used to HMAC-sign CAS tokens (set a stable value in production).
kompile.project-store-server.token-secret=${KOMPILE_PROJECT_STORE_TOKEN_SECRET:kompile-project-store-dev-secret}

# ---- Persistence (H2 file-backed by default; point at PostgreSQL in production) ----
# DB_CLOSE_DELAY=-1: keep the file DB open for the JVM lifetime so a transient HikariCP
# drop-to-zero-connections can't close it (else permanent "database has been closed [90098]").
spring.datasource.url=${PROJECT_STORE_DB_URL:jdbc:h2:file:${user.home}/.kompile/project-store-server/metadata-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.bytecode.provider=none

# Allow large xorb/shard uploads.
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB
server.tomcat.max-swallow-size=-1
