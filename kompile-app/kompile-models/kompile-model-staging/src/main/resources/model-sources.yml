# Model Sources Configuration
# Defines external sources for downloading models

sources:
  huggingface:
    base_url: https://huggingface.co
    enabled: true

  github:
    base_url: https://github.com/GetKompile/kompile/releases/download
    enabled: true

  custom:
    base_url: ${KOMPILE_MODEL_MIRROR_URL:}
    enabled: ${KOMPILE_MODEL_MIRROR_ENABLED:false}

# Model Catalog
# Pre-defined models that can be downloaded and converted
#
# Resource fields (added per model):
#   ram_mb  - host RAM needed to run inference (0 = unknown)
#   vram_mb - GPU VRAM needed (0 = CPU-capable, no GPU required)
#   disk_mb - download + extracted on-disk footprint (0 = unknown)
#
# Basis: ONNX export sizes from HuggingFace model cards + empirical headroom
# for runtime buffers (~2x weights for encoder, ~1.5x for cross-encoder).
# vram_mb is 0 for all entries: every model here runs on CPU via ONNX Runtime.

model_catalog:
  encoders:
    # Encoders: ONNX Runtime inference; ram_mb ~2x weights + batch buffers.
    - id: bge-base-en-v1.5
      source: huggingface
      repo: BAAI/bge-base-en-v1.5
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        embedding_dim: 768
        max_sequence_length: 512
        description: "BGE Base English v1.5 - Dense retrieval encoder"
        ram_mb: 1024
        vram_mb: 0
        disk_mb: 450

    - id: bge-small-en-v1.5
      source: huggingface
      repo: BAAI/bge-small-en-v1.5
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        embedding_dim: 384
        max_sequence_length: 512
        description: "BGE Small English v1.5 - Lightweight encoder"
        ram_mb: 512
        vram_mb: 0
        disk_mb: 150

    - id: bge-large-en-v1.5
      source: huggingface
      repo: BAAI/bge-large-en-v1.5
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        embedding_dim: 1024
        max_sequence_length: 512
        description: "BGE Large English v1.5 - High-quality encoder"
        ram_mb: 2048
        vram_mb: 0
        disk_mb: 1300

    - id: bge-m3
      source: huggingface
      repo: BAAI/bge-m3
      format: onnx
      files:
        model: onnx/model.onnx
        model_data: onnx/model.onnx_data
        vocab: onnx/tokenizer.json
      metadata:
        embedding_dim: 1024
        max_sequence_length: 8192
        description: "BGE-M3 Multilingual dense embedding model - supports 100+ languages"
        multilingual: true
        ram_mb: 4096
        vram_mb: 0
        disk_mb: 2300

    - id: arctic-embed-l
      source: huggingface
      repo: Snowflake/arctic-embed-l
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: tokenizer.json
      metadata:
        embedding_dim: 1024
        max_sequence_length: 8192
        description: "Snowflake Arctic Embed L - Long context encoder"
        ram_mb: 2048
        vram_mb: 0
        disk_mb: 1400

    - id: e5-base-v2
      source: huggingface
      repo: intfloat/e5-base-v2
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        embedding_dim: 768
        max_sequence_length: 512
        description: "E5 Base v2 - General purpose encoder"
        ram_mb: 1024
        vram_mb: 0
        disk_mb: 440

  cross_encoders:
    # Cross-encoders: smaller than encoders; ram_mb ~1.5x weights.
    - id: ms-marco-MiniLM-L-6-v2
      source: huggingface
      repo: cross-encoder/ms-marco-MiniLM-L6-v2
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        hidden_size: 384
        num_layers: 6
        max_sequence_length: 512
        training_data: "MS MARCO"
        description: "MiniLM L6 cross-encoder for reranking"
        ram_mb: 512
        vram_mb: 0
        disk_mb: 100

    - id: ms-marco-MiniLM-L-12-v2
      source: huggingface
      repo: cross-encoder/ms-marco-MiniLM-L12-v2
      format: onnx
      files:
        model: onnx/model.onnx
        vocab: vocab.txt
      metadata:
        hidden_size: 384
        num_layers: 12
        max_sequence_length: 512
        training_data: "MS MARCO"
        description: "MiniLM L12 cross-encoder for reranking"
        ram_mb: 768
        vram_mb: 0
        disk_mb: 150

  vlm:
    # VLMs: multi-component ONNX pipelines; ram_mb covers all components loaded simultaneously.
    - id: florence-2-base
      source: huggingface
      repo: microsoft/Florence-2-base
      format: onnx
      files:
        vision_encoder: onnx/vision_encoder.onnx
        decoder: onnx/decoder_model.onnx
        embed_tokens: onnx/embed_tokens.onnx
        tokenizer: tokenizer.json
      metadata:
        hidden_size: 768
        description: "Florence-2 Base - Document understanding and OCR"
        ram_mb: 4096
        vram_mb: 0
        disk_mb: 1100

    - id: florence-2-large
      source: huggingface
      repo: microsoft/Florence-2-large
      format: onnx
      files:
        vision_encoder: onnx/vision_encoder.onnx
        decoder: onnx/decoder_model.onnx
        embed_tokens: onnx/embed_tokens.onnx
        tokenizer: tokenizer.json
      metadata:
        hidden_size: 1024
        description: "Florence-2 Large - High-quality document understanding and OCR"
        ram_mb: 8192
        vram_mb: 0
        disk_mb: 3100

    - id: smoldocling-256m
      source: huggingface
      repo: docling-project/SmolDocling-256M-preview
      format: vlm
      files:
        model: onnx/decoder_model_merged.onnx
        vision_encoder: onnx/vision_encoder.onnx
        embed_tokens: onnx/embed_tokens.onnx
        vocab: tokenizer.json
        tokenizer_config: tokenizer_config.json
        preprocessor_config: preprocessor_config.json
        processor_config: processor_config.json
        generation_config: generation_config.json
      metadata:
        description: "SmolDocling 256M - Compact document understanding VLM"
        ram_mb: 4096
        vram_mb: 0
        disk_mb: 2600

  llm:
    # LLM section: GGUF files run via llama.cpp (llm_ggml type); ram_mb covers KV-cache + weights.
    - id: lfm2.5-1.2b-instruct
      source: huggingface
      repo: LiquidAI/LFM2.5-1.2B-Instruct-GGUF
      format: gguf
      files:
        model: LFM2.5-1.2B-Instruct-Q4_K_M.gguf
        vocab: tokenizer.json
      metadata:
        description: "LFM2.5 1.2B Instruct Q4_K_M - Compact local LLM for chat lane"
        ram_mb: 3072
        vram_mb: 0
        disk_mb: 750
