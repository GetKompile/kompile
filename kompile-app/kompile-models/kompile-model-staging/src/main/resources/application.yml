server:
  port: 8090
  address: ${KOMPILE_STAGING_ADDRESS:127.0.0.1}

kompile:
  staging:
    security:
      lan-enabled: ${KOMPILE_STAGING_LAN_ENABLED:false}
      api-token: ${KOMPILE_STAGING_API_TOKEN:}
      allowed-origins: ${KOMPILE_STAGING_ALLOWED_ORIGINS:}
    ui:
      enabled: true
    app:
      enabled: true
    model-dir: ${user.home}/.kompile/models
    staging-dir: ${user.home}/.kompile/models/.staging
    generated-artifacts-dir: ${user.home}/.kompile/models/.generated
    artifact-transfer-token: ${KOMPILE_STAGING_ARTIFACT_TOKEN:}
    settings-dir: ${user.home}/.kompile
    project-dir: ""
    limits:
      model-bytes: ${KOMPILE_STAGING_MODEL_BYTES:8589934592}
      tokenizer-bytes: ${KOMPILE_STAGING_TOKENIZER_BYTES:67108864}
      config-bytes: ${KOMPILE_STAGING_CONFIG_BYTES:8388608}
      total-bytes: ${KOMPILE_STAGING_TOTAL_BYTES:9663676416}
      local-max-files: ${KOMPILE_STAGING_LOCAL_MAX_FILES:64}
      local-max-depth: ${KOMPILE_STAGING_LOCAL_MAX_DEPTH:4}
      max-redirects: ${KOMPILE_STAGING_MAX_REDIRECTS:5}
      cancellation-wait-millis: ${KOMPILE_STAGING_CANCELLATION_WAIT_MILLIS:60000}
    # Host-only target compilation for downloadable Android .kproject artifacts.
    # Supply compiler-command as a YAML argument vector or indexed command-line
    # properties; it is executed directly and never through a shell.
    sdx:
      cache-dir: ${user.home}/.kompile/models/.staging/sdx-cache
      compiler-command: []
      compiler-id: ""
      compiler-version: ""
      compiler-fingerprint: ""
      max-knowledge-files: 100000
      max-knowledge-bytes: 2147483648

  # Archive configuration
  archive:
    # Remote catalog URLs (checked in order)
    catalog:
      urls:
        - https://github.com/GetKompile/kompile/releases/latest/download/catalog.json
        - https://kompile.ai/archives/catalog.json
      refresh-interval: 24h

    # Authentication settings
    auth:
      bearer-token: ${KOMPILE_ARCHIVE_TOKEN:}
      basic:
        username: ${KOMPILE_ARCHIVE_USER:}
        password: ${KOMPILE_ARCHIVE_PASS:}
      s3:
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}

    # Download settings
    download:
      resume-enabled: true
      chunk-size: 8388608  # 8MB
      timeout: 300000      # 5 minutes
      connection-timeout: 10000
      read-timeout: 30000

spring:
  application:
    name: kompile-model-staging

  # File upload configuration - ML models can be several GB
  servlet:
    multipart:
      enabled: true
      max-file-size: ${KOMPILE_STAGING_MULTIPART_FILE_SIZE:8GB}
      max-request-size: ${KOMPILE_STAGING_MULTIPART_REQUEST_SIZE:9GB}
      file-size-threshold: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    ai.kompile: INFO
    org.nd4j: WARN
    org.bytedeco: WARN
