# TensorFlow Model Importer Application Properties
spring.application.name=tensorflow-model-importer
# 8091, not 8081: 8081 and 8082 belong to kompile-app-chat and kompile-app-crawl-manager, and an
# importer started while that stack is up would fail to bind. The importers sit with the other
# support services in the 809x range (staging 8090, graph-service 8095).
server.port=${KOMPILE_TF_IMPORTER_PORT:8091}

# Logging configuration
logging.level.ai.kompile.model.importer.tensorflow=INFO
logging.level.org.eclipse.deeplearning4j=WARN
logging.level.org.bytedeco=WARN

# Multipart file configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Application info
info.app.name=TensorFlow Model Importer
info.app.description=REST API and CLI tool for importing TensorFlow models to SameDiff format
info.app.version=1.0.0
