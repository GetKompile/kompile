# ONNX Model Importer Application Properties
spring.application.name=onnx-model-importer
# 8092, not 8082: 8082 is kompile-app-crawl-manager's port. See the tensorflow importer for the
# reasoning; the importers live in the 809x support-service range.
server.port=${KOMPILE_ONNX_IMPORTER_PORT:8092}

# Logging configuration
logging.level.ai.kompile.model.importer.onnx=INFO
logging.level.org.eclipse.deeplearning4j=WARN
logging.level.org.bytedeco=WARN

# Multipart file configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Application info
info.app.name=ONNX Model Importer
info.app.description=REST API and CLI tool for importing ONNX models to SameDiff format
info.app.version=1.0.0
