# Native-image class-initialization policy shared by every app built on the web layer.
#
# kompile-app-web-shared is on the classpath of all three Boot apps (kompile-app-chat,
# kompile-app-crawl-manager, kompile-app-main), so GraalVM auto-discovers this file for
# each of them and the persona `native` profiles do not have to repeat ~90 buildArgs to
# get the same ND4J/JavaCPP/Tomcat init policy that app-main took to get right.
#
# Keep in sync with kompile-app-main/src/main/resources/META-INF/native-image/main/
# native-image.properties, which carries the same policy for RAG spins that depend on
# app-main as a library. Both files declaring an identical arg is harmless — GraalVM
# concatenates Args across properties files and these are all idempotent.
#
# What does NOT belong here: machine-specific flags (-J-Xmx, --verbose), resource
# include/exclude policy, -H:ConfigurationFileDirectories, and Oracle-enterprise-only
# flags such as -H:-MLProfileInference (they break GraalVM CE consumer builds). Those
# stay in the poms.
Args = --no-fallback \
       --allow-incomplete-classpath \
       --enable-url-protocols=https,http \
       --initialize-at-build-time=org.slf4j \
       --initialize-at-build-time=ch.qos.logback \
       --initialize-at-build-time=org.nd4j.linalg.api.memory.deallocation \
       --initialize-at-build-time=org.nd4j.shade.protobuf \
       --initialize-at-build-time=com.google.protobuf \
       --initialize-at-build-time=com.google.gson \
       --initialize-at-build-time=org.apache.lucene.search.Query \
       --initialize-at-run-time=org.bytedeco.javacpp.Loader,org.bytedeco.javacpp.Loader$Helper,org.bytedeco.javacpp.Pointer,org.bytedeco.javacpp.Pointer$DeallocatorThread,org.bytedeco.javacpp.Pointer$NativeDeallocator,org.bytedeco.javacpp.PointerScope,org.bytedeco.javacpp.indexer \
       --initialize-at-run-time=org.eclipse.deeplearning4j \
       --initialize-at-run-time=org.nd4j \
       --initialize-at-run-time=org.nd4j.imports.converters.DifferentialFunctionClassHolder,org.nd4j.linalg.api.ops,org.nd4j.autodiff.samediff,org.nd4j.linalg.factory.Nd4j,org.nd4j.nativeblas.NativeOpsHolder,org.nd4j.linalg.learning.config,org.nd4j.linalg.api.memory.deallocation.DeallocatorService \
       --initialize-at-run-time=org.nd4j.linalg.cpu.nativecpu.NDArray,org.nd4j.linalg.cpu.nativecpu.CpuNDArrayFactory,org.nd4j.linalg.cpu.nativecpu.CpuBackend,org.nd4j.linalg.cpu.nativecpu.CpuEnvironment,org.nd4j.linalg.cpu.nativecpu.buffer.CpuDeallocator,org.nd4j.linalg.cpu.nativecpu.bindings.Nd4jCpu$Environment \
       --initialize-at-run-time=org.nd4j.linalg.jcublas,org.nd4j.jita \
       --initialize-at-run-time=org.nd4j.linalg.jzluda \
       --initialize-at-run-time=org.nd4j.linalg.jtpu \
       --initialize-at-run-time=org.nd4j.linalg.hexagon \
       --initialize-at-run-time=org.nd4j.dsp,org.nd4j.linalg.minimal \
       --initialize-at-run-time=org.nd4j.common.config.ND4JClassLoading \
       --initialize-at-run-time=org.eclipse.deeplearning4j.nativeblas.NativeOpsHolder,org.eclipse.deeplearning4j.linalg.api.memory.deallocation.DeallocatorService$DeallocatorServiceThread,org.eclipse.deeplearning4j.linalg.factory.Nd4j,org.eclipse.deeplearning4j.autodiff.samediff.internal.memory.ArrayCacheMemoryMgr,org.eclipse.deeplearning4j.linalg.api.ops.impl.layers.ExternalErrorsFunction,org.eclipse.deeplearning4j.tokenizers.presets.TokenizersHelper,org.eclipse.deeplearning4j.tokenizers.bindings.TokenizersNative \
       --initialize-at-run-time=org.eclipse.deeplearning4j.linalg.cpu.nativecpu \
       --initialize-at-run-time=org.eclipse.deeplearning4j.linalg.jcublas,org.eclipse.deeplearning4j.jita \
       --initialize-at-run-time=org.eclipse.deeplearning4j.linalg.jzluda,org.eclipse.deeplearning4j.linalg.jtpu,org.eclipse.deeplearning4j.linalg.hexagon,org.eclipse.deeplearning4j.dsp,org.eclipse.deeplearning4j.linalg.minimal \
       --initialize-at-run-time=org.bytedeco.openblas,org.bytedeco.mkl,org.bytedeco.mkldnn,org.bytedeco.dnnl \
       --initialize-at-run-time=org.bytedeco.onnxruntime,org.bytedeco.onnx,org.bytedeco.opencl \
       --initialize-at-run-time=org.bytedeco.tensorflow,org.bytedeco.tensorrt \
       --initialize-at-run-time=org.bytedeco.cuda \
       --initialize-at-run-time=org.bytedeco.opencv,org.bytedeco.ffmpeg,org.bytedeco.hdf5 \
       --initialize-at-run-time=org.bytedeco.leptonica,org.bytedeco.tesseract,org.bytedeco.artoolkitplus,org.bytedeco.flandmark,org.bytedeco.libdc1394,org.bytedeco.libfreenect,org.bytedeco.libfreenect2,org.bytedeco.librealsense,org.bytedeco.librealsense2,org.bytedeco.flycapture,org.bytedeco.videoinput \
       --initialize-at-run-time=org.bytedeco.systems,org.bytedeco.cpython,org.bytedeco.numpy,org.bytedeco.tvm,org.bytedeco.llvm \
       --initialize-at-run-time=org.apache.lucene.util.ScalarQuantizer \
       --initialize-at-run-time=io.netty.channel.epoll.Epoll \
       --initialize-at-run-time=com.sun.jna.Native \
       --initialize-at-run-time=net.bytebuddy \
       --initialize-at-run-time=org.apache.tomcat.util.compat,org.apache.catalina.webresources.DirResourceSet,org.apache.tomcat.jni.SSL,org.apache.tomcat.util.net.openssl.OpenSSLContext,org.apache.tomcat.util.net.openssl.OpenSSLEngine,org.apache.catalina.mbeans.MBeanUtils,org.apache.catalina.mbeans.MBeanFactory \
       --initialize-at-run-time=org.jline.nativ.JLineLibrary,org.jline.terminal.impl.jna,org.jline.terminal.impl.jna.linux.LinuxNativePty$UtilLibrary \
       --initialize-at-run-time=org.springframework.ai.chat.client.advisor,reactor.core.scheduler,org.springframework.web.reactive.function.client.DefaultExchangeStrategiesBuilder,org.springframework.boot.loader.ref.DefaultCleaner,org.springframework.boot.loader.ref.Cleaner,org.springframework.core.io.VfsUtils \
       --initialize-at-run-time=ai.onnxruntime \
       -H:+AllowDeprecatedBuilderClassesOnImageClasspath \
       -H:LargeArrayThreshold=8192 \
       -H:ServiceLoaderFeatureExcludeServices=org.hibernate.bytecode.spi.BytecodeProvider
