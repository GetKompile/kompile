<!-- Index Status Banner - shown when no indices are loaded -->
<app-index-status-banner (navigateToTab)="handleBannerNavigation($event)"></app-index-status-banner>

<div class="app-container">
  <header>
    <!-- Modular, white-labelable branding (logo + name). See BrandingComponent. -->
    <app-branding></app-branding>

    <!-- Model Status Indicator -->
    <app-model-status-indicator (openStaging)="openModelStaging()"></app-model-status-indicator>

    <!-- Fact Sheet Selector -->
    <div class="fact-sheet-selector">
      <button mat-button [matMenuTriggerFor]="factSheetMenu" class="fact-sheet-button">
        <mat-icon [style.color]="activeFactSheet?.color || '#1976d2'">{{ activeFactSheet?.icon || 'folder' }}</mat-icon>
        <span class="fact-sheet-name">{{ activeFactSheet?.name || 'No Fact Sheet' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #factSheetMenu="matMenu" class="fact-sheet-menu">
        <div class="menu-header">
          <span>Switch Fact Sheet</span>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item *ngFor="let sheet of factSheets"
                (click)="selectFactSheet(sheet)"
                [class.active-sheet]="sheet.id === activeFactSheet?.id">
          <mat-icon [style.color]="sheet.color">{{ sheet.icon }}</mat-icon>
          <span>{{ sheet.name }}</span>
          <span class="fact-count">({{ sheet.factCount }} facts)</span>
          <mat-icon *ngIf="sheet.id === activeFactSheet?.id" class="check-icon">check</mat-icon>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="openCreateFactSheetDialog()">
          <mat-icon>add</mat-icon>
          <span>Create New Fact Sheet</span>
        </button>
      </mat-menu>
    </div>

    <!-- Light/Dark theme toggle (ThemeService). Components conform via the shared design tokens. -->
    <button mat-icon-button class="theme-toggle-btn"
            (click)="toggleTheme()"
            [attr.aria-label]="isDark ? 'Switch to light theme' : 'Switch to dark theme'"
            [title]="isDark ? 'Switch to light theme' : 'Switch to dark theme'">
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </header>

  <!-- Create Fact Sheet Dialog -->
  <div class="dialog-overlay" *ngIf="showCreateFactSheetDialog" (click)="closeCreateFactSheetDialog()">
    <div class="dialog-content" (click)="$event.stopPropagation()">
      <h2>Create New Fact Sheet</h2>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Name</mat-label>
        <input matInput [(ngModel)]="newFactSheetName" [ngModelOptions]="{standalone: true}" placeholder="My Fact Sheet">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description (optional)</mat-label>
        <textarea matInput [(ngModel)]="newFactSheetDescription" [ngModelOptions]="{standalone: true}" rows="2" placeholder="What is this fact sheet for?"></textarea>
      </mat-form-field>
      <div class="dialog-actions">
        <button mat-button (click)="closeCreateFactSheetDialog()">Cancel</button>
        <button mat-raised-button color="primary" (click)="createFactSheet()" [disabled]="!newFactSheetName.trim()">
          Create
        </button>
      </div>
    </div>
  </div>

  <nav mat-tab-nav-bar [tabPanel]="tabPanel" backgroundColor="primary">
    <a mat-tab-link (click)="activeTab = 'unifiedChat'" [active]="activeTab === 'unifiedChat'">
      Chat
    </a>
    <a mat-tab-link (click)="activeTab = 'project'" [active]="activeTab === 'project'">
      Project
    </a>
    <a mat-tab-link (click)="activeTab = 'sources'" [active]="activeTab === 'sources'" class="fact-sheets-tab">
      Fact Sheets
      <span class="active-jobs-badge" *ngIf="activeJobsCount > 0" [title]="getActiveJobsSummary()">
        <span class="badge-pulse"></span>
        {{ activeJobsCount }}
      </span>
    </a>
    <a mat-tab-link (click)="activeTab = 'tools'" [active]="activeTab === 'tools'">
      Data
    </a>
    <a mat-tab-link (click)="activeTab = 'developer'" [active]="activeTab === 'developer'">
      Developer
    </a>
    <a mat-tab-link (click)="activeTab = 'kclaw'" [active]="activeTab === 'kclaw'">
      Agents
    </a>
    <a mat-tab-link (click)="activeTab = 'grounding'" [active]="activeTab === 'grounding'">
      Grounding
    </a>
    <a mat-tab-link (click)="activeTab = 'enforcer'" [active]="activeTab === 'enforcer'">
      Enforcer
    </a>
  </nav>
  <mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>

  <div class="content-with-explorer">
    <!-- Project Explorer Sidebar -->
    <app-project-explorer (navigateToTab)="handleBannerNavigation($event)"></app-project-explorer>

    <main>
      <div *ngIf="activeTab === 'unifiedChat'">
        <app-unified-chat></app-unified-chat>
      </div>
      <div *ngIf="activeTab === 'project'">
        <app-project-manager></app-project-manager>
        <app-project-store-panel></app-project-store-panel>
      </div>
      <div *ngIf="activeTab === 'sources'">
        <app-fact-sheet-manager (openModelStaging)="openModelStaging()"></app-fact-sheet-manager>
      </div>
      <div *ngIf="activeTab === 'tools'">
        <app-tools-hub></app-tools-hub>
      </div>
      <div *ngIf="activeTab === 'developer'">
        <app-developer-hub></app-developer-hub>
      </div>
      <div *ngIf="activeTab === 'kclaw'">
        <app-kclaw-hub></app-kclaw-hub>
      </div>
      <div *ngIf="activeTab === 'enforcer'">
        <app-enforcer-hub></app-enforcer-hub>
      </div>
      <div *ngIf="activeTab === 'grounding'">
        <app-grounding-console-panel></app-grounding-console-panel>
      </div>
    </main>
  </div>

  <footer>
    <p>{{ title }}</p>
  </footer>
</div>
