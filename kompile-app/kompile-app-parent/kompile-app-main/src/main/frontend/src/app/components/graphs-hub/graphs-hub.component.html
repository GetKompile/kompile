<div class="graphs-hub">
  <div class="hub-header">
    <h2>Graphs</h2>
    <p class="subtitle">Manage knowledge graphs as assets — the named-graph registry, health metrics over time, and maintenance.</p>
  </div>

  <div class="sub-tabs">
    <button class="sub-tab" [class.active]="activeSubTab === 'visualizer'" (click)="selectSubTab('visualizer')">
      <mat-icon class="tab-icon">scatter_plot</mat-icon>
      <span class="tab-label">Visualizer</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'entityBrowser'" (click)="selectSubTab('entityBrowser')">
      <mat-icon class="tab-icon">list_alt</mat-icon>
      <span class="tab-label">Entity Browser</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'hierarchy'" (click)="selectSubTab('hierarchy')">
      <mat-icon class="tab-icon">lan</mat-icon>
      <span class="tab-label">Hierarchy</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'builder'" (click)="selectSubTab('builder')">
      <mat-icon class="tab-icon">construction</mat-icon>
      <span class="tab-label">Builder</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'eventObservation'" (click)="selectSubTab('eventObservation')">
      <mat-icon class="tab-icon">query_stats</mat-icon>
      <span class="tab-label">Event Observation</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'causalAttribution'" (click)="selectSubTab('causalAttribution')">
      <mat-icon class="tab-icon">psychology</mat-icon>
      <span class="tab-label">Causal Attribution</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'overview'" (click)="selectSubTab('overview')">
      <mat-icon class="tab-icon">account_tree</mat-icon>
      <span class="tab-label">Overview</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'health'" (click)="selectSubTab('health')">
      <mat-icon class="tab-icon">monitor_heart</mat-icon>
      <span class="tab-label">Health</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'ontology'" (click)="selectSubTab('ontology')">
      <mat-icon class="tab-icon">schema</mat-icon>
      <span class="tab-label">Ontology</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'pipelines'" (click)="selectSubTab('pipelines')">
      <mat-icon class="tab-icon">cable</mat-icon>
      <span class="tab-label">Channel Pipelines</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'provenance'" (click)="selectSubTab('provenance')">
      <mat-icon class="tab-icon">history_edu</mat-icon>
      <span class="tab-label">Provenance</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'diff'" (click)="selectSubTab('diff')">
      <mat-icon class="tab-icon">difference</mat-icon>
      <span class="tab-label">Diff</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'maintenance'" (click)="selectSubTab('maintenance')">
      <mat-icon class="tab-icon">build</mat-icon>
      <span class="tab-label">Maintenance</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'rules'" (click)="selectSubTab('rules')">
      <mat-icon class="tab-icon">rule</mat-icon>
      <span class="tab-label">Rules</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'extract'" (click)="selectSubTab('extract')">
      <mat-icon class="tab-icon">auto_awesome</mat-icon>
      <span class="tab-label">Extraction</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'patch'" (click)="selectSubTab('patch')">
      <mat-icon class="tab-icon">edit_note</mat-icon>
      <span class="tab-label">Data Patch</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'eval'" (click)="selectSubTab('eval')">
      <mat-icon class="tab-icon">bug_report</mat-icon>
      <span class="tab-label">Eval Debugger</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'io'" (click)="selectSubTab('io')">
      <mat-icon class="tab-icon">import_export</mat-icon>
      <span class="tab-label">Import / Export</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'grounding'" (click)="selectSubTab('grounding')">
      <mat-icon class="tab-icon">hub</mat-icon>
      <span class="tab-label">Grounding</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'processes'" (click)="selectSubTab('processes')">
      <mat-icon class="tab-icon">timeline</mat-icon>
      <span class="tab-label">Processes</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'audit'" (click)="selectSubTab('audit')">
      <mat-icon class="tab-icon">history</mat-icon>
      <span class="tab-label">Audit</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'hydration'" (click)="selectSubTab('hydration')">
      <mat-icon class="tab-icon">water</mat-icon>
      <span class="tab-label">Hydration</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'factsByTier'" (click)="selectSubTab('factsByTier')">
      <mat-icon class="tab-icon">grade</mat-icon>
      <span class="tab-label">Facts by Tier</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'weights'" (click)="selectSubTab('weights')">
      <mat-icon class="tab-icon">scale</mat-icon>
      <span class="tab-label">Weights</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'opinions'" (click)="selectSubTab('opinions')">
      <mat-icon class="tab-icon">psychology_alt</mat-icon>
      <span class="tab-label">Opinions</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'communities'" (click)="selectSubTab('communities')">
      <mat-icon class="tab-icon">bubble_chart</mat-icon>
      <span class="tab-label">Communities</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'folRules'" (click)="selectSubTab('folRules')">
      <mat-icon class="tab-icon">rule</mat-icon>
      <span class="tab-label">FOL Rules</span>
    </button>
    <button class="sub-tab" [class.active]="activeSubTab === 'processLineage'" (click)="selectSubTab('processLineage')">
      <mat-icon class="tab-icon">device_hub</mat-icon>
      <span class="tab-label">Process Lineage</span>
    </button>
  </div>

  <div class="sub-tab-content">
    <div *ngIf="activeSubTab === 'visualizer'" class="graph-explore-panel">
      <app-graph-visualizer
        [factSheetId]="activeFactSheet?.id || null"
        [factSheetName]="activeFactSheet?.name || ''"
        [focusNodeId]="focusNodeId">
      </app-graph-visualizer>
    </div>
    <div *ngIf="activeSubTab === 'entityBrowser'" class="graph-explore-panel">
      <app-entity-browser
        [factSheetId]="activeFactSheetId"
        (entitySelected)="onEntitySelected($event)"
        (navigateToGraph)="onNavigateToGraph($event)">
      </app-entity-browser>
    </div>
    <div *ngIf="activeSubTab === 'hierarchy'" class="graph-explore-panel">
      <app-graph-hierarchy
        [factSheetId]="activeFactSheetId"
        (navigateToGraph)="onNavigateToGraph($event)"
        (viewSubGraph)="onNavigateToGraph($event)">
      </app-graph-hierarchy>
    </div>
    <div *ngIf="activeSubTab === 'builder'">
      <app-knowledge-graph-builder></app-knowledge-graph-builder>
    </div>
    <div *ngIf="activeSubTab === 'eventObservation'">
      <app-event-observation-dashboard (openInAttribution)="onAttributeNode($event)"></app-event-observation-dashboard>
    </div>
    <div *ngIf="activeSubTab === 'causalAttribution'">
      <app-causal-attribution-panel [seedNodeId]="attributionSeedNodeId"></app-causal-attribution-panel>
    </div>
    <div *ngIf="activeSubTab === 'overview'">
      <app-graph-overview></app-graph-overview>
    </div>
    <div *ngIf="activeSubTab === 'health'">
      <app-graph-health-panel [factSheetId]="activeFactSheetId"></app-graph-health-panel>
    </div>
    <div *ngIf="activeSubTab === 'ontology'">
      <app-graph-ontology-panel [factSheetId]="activeFactSheetId"></app-graph-ontology-panel>
    </div>
    <div *ngIf="activeSubTab === 'pipelines'">
      <app-graph-pipelines-panel [factSheetId]="activeFactSheetId"></app-graph-pipelines-panel>
    </div>
    <div *ngIf="activeSubTab === 'provenance'">
      <app-graph-provenance-panel [factSheetId]="activeFactSheetId"></app-graph-provenance-panel>
    </div>
    <div *ngIf="activeSubTab === 'diff'">
      <app-graph-diff-panel [factSheetId]="activeFactSheetId"></app-graph-diff-panel>
    </div>
    <div *ngIf="activeSubTab === 'maintenance'">
      <app-graph-maintenance-hub [factSheetId]="activeFactSheetId"></app-graph-maintenance-hub>
    </div>
    <div *ngIf="activeSubTab === 'rules'">
      <app-graph-rules-panel [factSheetId]="activeFactSheetId"></app-graph-rules-panel>
    </div>
    <div *ngIf="activeSubTab === 'extract'">
      <app-multi-agent-graph-extraction></app-multi-agent-graph-extraction>
    </div>
    <div *ngIf="activeSubTab === 'patch'">
      <app-graph-data-patch [factSheetId]="activeFactSheetId"></app-graph-data-patch>
    </div>
    <div *ngIf="activeSubTab === 'eval'">
      <app-graph-eval-debugger></app-graph-eval-debugger>
    </div>
    <div *ngIf="activeSubTab === 'io'">
      <app-graph-io-panel [factSheetId]="activeFactSheetId"></app-graph-io-panel>
    </div>
    <div *ngIf="activeSubTab === 'grounding'">
      <app-grounding-console-panel></app-grounding-console-panel>
    </div>
    <div *ngIf="activeSubTab === 'processes'">
      <app-process-mining-panel [factSheetIdInput]="activeFactSheetId"></app-process-mining-panel>
    </div>
    <div *ngIf="activeSubTab === 'audit'">
      <app-audit-timeline [factSheetId]="activeFactSheetId"></app-audit-timeline>
    </div>
    <div *ngIf="activeSubTab === 'hydration'">
      <app-hydration-progress-panel></app-hydration-progress-panel>
    </div>
    <div *ngIf="activeSubTab === 'factsByTier'">
      <app-facts-by-tier-panel [factSheetId]="activeFactSheetId"></app-facts-by-tier-panel>
    </div>
    <div *ngIf="activeSubTab === 'weights'">
      <app-kb-weights-panel [factSheetId]="activeFactSheetId"></app-kb-weights-panel>
    </div>
    <div *ngIf="activeSubTab === 'opinions'">
      <app-opinion-browser [factSheetId]="activeFactSheetId"></app-opinion-browser>
    </div>
    <div *ngIf="activeSubTab === 'communities'">
      <app-community-panel [factSheetId]="activeFactSheetId"></app-community-panel>
    </div>
    <div *ngIf="activeSubTab === 'folRules'">
      <app-fol-rules-browser [factSheetId]="activeFactSheetId"></app-fol-rules-browser>
    </div>
    <div *ngIf="activeSubTab === 'processLineage'">
      <app-process-lineage-panel [factSheetId]="activeFactSheetId"></app-process-lineage-panel>
    </div>
  </div>
</div>
