# Kompile Lite - Self-Contained Chat + RAG + Graph RAG
spring.application.name=kompile-lite
server.port=8090

# Embedding
kompile.embedding.type=anserini
kompile.embedding.anserini.model=bge-base-en-v1.5

# Vector Store
kompile.vectorstore.type=anserini
kompile.vectorstore.anserini.persistence.enabled=true
kompile.vectorstore.anserini.persistence.index-path=${user.home}/.kompile/lite/index

# Knowledge Graph (matrix-based, auto-activates with VectorStore)
kompile.knowledgegraph.type=matrix

# Models
kompile.models.source-type=HYBRID
kompile.models.cache-dir=${user.home}/.kompile/models

# Chunker
kompile.chunker.type=sentence

# Chat History (embedded H2)
# DB_CLOSE_DELAY=-1: keep the file DB open for the JVM lifetime so a transient HikariCP
# drop-to-zero-connections can't close it (else permanent "database has been closed [90098]").
spring.datasource.url=jdbc:h2:file:${user.home}/.kompile/lite/chat-history;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# File upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Logging
logging.level.ai.kompile=INFO
logging.level.org.springframework=WARN

# ND4J
org.bytedeco.javacpp.nopointergc=true

# ── Confidence / Evidence model (Pillar 1 + 3, Slice 1) ──────────────────────
# Prior strength (W) for Beta-distribution evidence initialisation.
# W=2: a single LLM extraction (trust=0.6) starts at expectation ≈ 0.23 (LOW band).
# ~13 high-trust observations are needed to reach ESTABLISHED (expectation>=0.85, u<0.15).
kompile.kb.evidence.priorStrength=2.0

# Default PSL soft-propagation rule weight for new fact sheets (cold start).
# Learned weights from the weight store overwrite this after the first cascade.
kompile.kb.psl.defaultRuleWeight=0.8

# ── Source trust defaults (Pillar 5 tier-1, Slice 1) ─────────────────────────
# These are overridable and represent the flat baseline trust for each source type.
kompile.kb.source-trust.email-from=0.95
kompile.kb.source-trust.email-to-cc=0.90
kompile.kb.source-trust.structured-upload=0.85
kompile.kb.source-trust.pdf-office=0.70
kompile.kb.source-trust.email-body=0.65
kompile.kb.source-trust.llm-extraction=0.60
kompile.kb.source-trust.web-scrape=0.45
kompile.kb.source-trust.default=0.50
