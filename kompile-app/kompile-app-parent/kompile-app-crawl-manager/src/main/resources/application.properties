# This file is intentionally empty, and it is NOT redundant: kompile-embedding-anserini ships its
# own classpath-root application.properties, and `classpath:/application.properties` resolves to the
# FIRST match on the classpath. This app's own (empty) copy wins, so the crawl manager gets the same
# in-code embedding defaults app-main does rather than the anserini jar's values. app-main carries
# an identical shadow file for the same reason.
#
# All configuration lives in:
#   - Managed JSON config files under ~/.kompile/config/
#   - In-code defaults (@ConfigurationProperties / @Value defaults)
#   - KompileBootstrapEnvironmentPostProcessor (kompile-app-web-shared's META-INF/spring.factories)
#   - application.yml, for this process's port and framework plumbing only
# Do not add active key=value lines here; use the above mechanisms instead.
