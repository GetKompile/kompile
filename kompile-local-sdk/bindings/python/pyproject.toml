[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kompile-local-sdk"
version = "0.1.0"
description = "Python bindings for the Kompile Local SDK (libkompile_reasoning + libsdx_llm ctypes)"
readme = "../../README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["kompile", "reasoning", "graph", "llm", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/deeplearning4j/kompile"
Repository = "https://github.com/deeplearning4j/kompile"

# No dependencies — pure ctypes, stdlib only.
# The native libraries (libkompile_reasoning.so, libsdx_llm.so) must be
# present on LD_LIBRARY_PATH or provided via the KOMPILE_LIB_DIR env var.

[tool.hatch.build.targets.sdist]
include = ["*.py", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["."]
