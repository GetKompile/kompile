name: Build Java Distributions

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in archives and transient Maven coordinates
        type: string
        default: 0.1.0-SNAPSHOT
      distribution:
        description: Java distribution shape to build (cli, full, or both)
        type: string
        default: cli
      platforms:
        description: Comma-separated platform ids to build
        type: string
        default: linux-x86_64,linux-arm64,windows-x86_64,windows-arm64,macosx-x86_64,macosx-arm64
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in archives and transient Maven coordinates
        required: true
        type: string
        default: 0.1.0-SNAPSHOT
      distribution:
        description: Java distribution shape to build
        required: true
        type: choice
        options:
          - cli
          - full
          - both
        default: cli
      platforms:
        description: Comma-separated platform ids (default is every free standard architecture)
        required: true
        type: string
        default: linux-x86_64,linux-arm64,windows-x86_64,windows-arm64,macosx-x86_64,macosx-arm64

permissions:
  contents: read

env:
  DL4J_MAVEN_REPOSITORY_URL: ${{ vars.DL4J_MAVEN_REPOSITORY_URL || 'https://central.sonatype.com/repository/maven-snapshots/' }}
  DL4J_MAVEN_REPOSITORY_ID: ${{ vars.DL4J_MAVEN_REPOSITORY_ID || 'dl4j-release' }}
  ND4J_VERSION: ${{ vars.DL4J_VERSION || '1.0.0-SNAPSHOT' }}
  MAVEN_OPTS: -Xmx4g

jobs:
  validate:
    name: Validate Java matrix request
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.request.outputs.version }}
      distribution: ${{ steps.request.outputs.distribution }}
      platforms: ${{ steps.request.outputs.platforms }}
      matrix: ${{ steps.request.outputs.matrix }}
    steps:
      - name: Validate inputs
        id: request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DISTRIBUTION: ${{ inputs.distribution }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_VERSION}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid version: ${REQUESTED_VERSION}" >&2
            exit 2
          fi
          case "${REQUESTED_DISTRIBUTION}" in
            cli|full|both) ;;
            *) echo "Invalid distribution: ${REQUESTED_DISTRIBUTION}" >&2; exit 2 ;;
          esac
          allowed=",linux-x86_64,linux-arm64,windows-x86_64,windows-arm64,macosx-x86_64,macosx-arm64,"
          IFS=',' read -ra requested <<< "${REQUESTED_PLATFORMS}"
          [ "${#requested[@]}" -gt 0 ] || { echo "At least one platform is required" >&2; exit 2; }
          normalized=()
          for platform in "${requested[@]}"; do
            platform="${platform//[[:space:]]/}"
            [ -n "${platform}" ] || continue
            if [[ "${allowed}" != *",${platform},"* ]]; then
              echo "Unsupported platform: ${platform}" >&2
              exit 2
            fi
            normalized+=("${platform}")
          done
          [ "${#normalized[@]}" -gt 0 ] || { echo "At least one platform is required" >&2; exit 2; }
          platforms="$(IFS=','; echo "${normalized[*]}")"
          matrix="$(node - "${REQUESTED_DISTRIBUTION}" "${platforms}" <<'NODE'
          const requestedDistribution = process.argv[2];
          const requestedPlatforms = new Set(process.argv[3].split(','));
          const runners = {
            'linux-x86_64': 'ubuntu-22.04',
            'linux-arm64': 'ubuntu-24.04-arm',
            'windows-x86_64': 'windows-2022',
            'windows-arm64': 'windows-11-arm',
            'macosx-x86_64': 'macos-15-intel',
            'macosx-arm64': 'macos-14',
          };
          const distributions = requestedDistribution === 'both'
            ? ['cli', 'full']
            : [requestedDistribution];
          const include = [];
          for (const [platform, runner] of Object.entries(runners)) {
            if (!requestedPlatforms.has(platform)) continue;
            for (const distribution of distributions) {
              include.push({
                runner,
                platform,
                distribution,
                variant: distribution === 'cli' ? 'cli-only' : 'full',
              });
            }
          }
          process.stdout.write(JSON.stringify({include}));
          NODE
          )"
          echo "version=${REQUESTED_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "distribution=${REQUESTED_DISTRIBUTION}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "Java distribution request: ${REQUESTED_DISTRIBUTION} on ${platforms}"

  build:
    name: Java ${{ matrix.distribution }} (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.distribution == 'full' && 180 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}

    steps:
      - name: Checkout selected branch commit
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Record runner capacity
        shell: bash
        run: |
          node - <<'NODE'
          const os = require('os');
          console.log(`platform=${process.platform} arch=${process.arch}`);
          console.log(`cpus=${os.cpus().length} memoryGiB=${(os.totalmem() / 1024 ** 3).toFixed(1)}`);
          NODE
          java -version
          mvn -version

      - name: Set transient Maven release version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          mvn -B -ntp -N org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
            -Dproperty=project.version \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Build Java distribution
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          export GRAALVM_HOME="${JAVA_HOME}"
          export KOMPILE_JAVA="${JAVA_HOME}/bin/java"
          export OUTPUT_DIR="${RUNNER_TEMP}/kompile-java-dist"
          ./build-dist.sh "${VARIANT}" \
            --jars-only \
            --skip-maven-install \
            --version "${VERSION}" \
            --platform "${PLATFORM}" \
            --output-dir "${OUTPUT_DIR}"
          classifier="${VARIANT}-${PLATFORM}"
          base="kompile-dist-${VERSION}-${classifier}"
          archive="${OUTPUT_DIR}/${base}.zip"
          checksum="${archive}.sha256"
          test -f "${archive}"
          test -f "${checksum}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"

      - name: Smoke Java archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          BASE: ${{ steps.package.outputs.base }}
        run: |
          set -euo pipefail
          EXTRACTED="${RUNNER_TEMP}/kompile-java-smoke"
          python3 - "${ARCHIVE}" "${EXTRACTED}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as value:
              value.extractall(destination)
          PY
          DIST_ROOT="${EXTRACTED}/${BASE}"
          test -f "${DIST_ROOT}/lib/kompile-cli.jar"
          python3 - "${DIST_ROOT}/.dist-info.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          info = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert info["components"]["cli"]["native"] is False
          assert info["components"]["cli"]["jar"] is True
          PY
          "${JAVA_HOME}/bin/java" -jar "${DIST_ROOT}/lib/kompile-cli.jar" --version

      - name: Upload Java distribution
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.distribution }}-${{ matrix.platform }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
