# ──────────────────────────────────────────────────────────────────────────────
# Kompile release pipeline
#
# Publishes both execution forms without paying AOT runner costs for the JVM tier:
# a cross-platform GraalVM CLI image and a complete Linux JVM distribution built
# with `build-dist.sh --jars-only`. Both use the canonical distribution builder,
# include SHA-256 checksums, and are attached to one GitHub Release. ZIP is the
# primary release artifact; tar.gz remains available for installer compatibility.
#
# Archive naming (must match install.sh + docs/getting-started/installation.md):
#   kompile-dist-<version>-<variant>-<os>-<arch>.zip
#   kompile-dist-<version>-<variant>-<os>-<arch>.tar.gz
#     os   ∈ { linux, macosx, windows }
#     arch ∈ { x86_64, arm64 }
#
# ⚠️  RUNNER SIZING — READ THIS FIRST
#   Java and AOT builds intentionally use separate runner variables. The JVM build
#   is suitable for a standard runner. The CLI native-image build passes `-J-Xmx18g`
#   (kompile-cli/kompile-cli-main/pom.xml), so each AOT runner needs ≥ 32 GB RAM.
#   Configure these repository variables (Settings -> Secrets and variables ->
#   Actions -> Variables):
#       KOMPILE_JAVA_RUNNER             (default: ubuntu-22.04; JVM build + smoke)
#       KOMPILE_AOT_LINUX_X64_RUNNER    (legacy fallback: KOMPILE_LINUX_X64_RUNNER)
#       KOMPILE_AOT_MACOS_ARM64_RUNNER  (legacy fallback: KOMPILE_MACOS_ARM64_RUNNER)
#       KOMPILE_AOT_WINDOWS_X64_RUNNER  (legacy fallback: KOMPILE_WINDOWS_X64_RUNNER)
#       KOMPILE_RELEASE_RUNNER          (default: ubuntu-22.04; lightweight publisher)
#       DL4J_MAVEN_REPOSITORY_URL    (optional repository containing the matching DL4J build)
#       DL4J_MAVEN_REPOSITORY_ID     (default: dl4j-release)
#       DL4J_VERSION                 (optional published DL4J version; defaults to the POM)
#   AOT defaults retain the old hosted labels for compatibility, but production
#   publication must point them at larger GitHub-hosted or self-hosted runners.
#
# Variants:
#   This workflow publishes cross-platform AOT `cli-only` archives and the
#   canonical Linux JVM `full` archive (CLI/service JARs + Java runtime).
#   Native CPU/GPU service variants remain self-hosted builds produced through
#   build-dist.sh; they must use the same release job when enabled.
# ──────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.1.0'
        required: true
        default: '0.0.0-dev'
      execution:
        description: 'Execution form to build'
        required: true
        type: choice
        options:
          - java
          - native
          - both
        default: java
      distribution:
        description: 'Distribution shape to build'
        required: true
        type: choice
        options:
          - cli
          - full
          - both
        default: cli
      platforms:
        description: 'Comma-separated Java platform ids'
        required: true
        type: string
        default: 'linux-x86_64,linux-arm64,windows-x86_64,macosx-arm64'
      publish:
        description: 'Create/update v<version> from the selected branch commit'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark a manually published release as a prerelease'
        required: true
        type: boolean
        default: true
      allow_constrained_aot:
        description: 'Allow a manual AOT trial below the production 32 GiB memory floor'
        required: true
        type: boolean
        default: false
      aot_probe_target:
        description: 'AOT target for a manual memory probe'
        required: true
        type: choice
        options:
          - cli
          - app
        default: cli

permissions:
  contents: write          # needed to create the GitHub Release

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  GRAALVM_JAVA_VERSION: '21'
  DL4J_MAVEN_REPOSITORY_URL: ${{ vars.DL4J_MAVEN_REPOSITORY_URL || 'https://central.sonatype.com/repository/maven-snapshots/' }}
  DL4J_MAVEN_REPOSITORY_ID: ${{ vars.DL4J_MAVEN_REPOSITORY_ID || 'dl4j-release' }}
  ND4J_VERSION: ${{ vars.DL4J_VERSION || '1.0.0-SNAPSHOT' }}

jobs:
  java-distributions:
    name: Java distributions
    if: github.event_name == 'workflow_dispatch' && (inputs.execution == 'java' || inputs.execution == 'both')
    uses: ./.github/workflows/build-java-distributions.yml
    with:
      version: ${{ inputs.version }}
      distribution: ${{ inputs.distribution }}
      platforms: ${{ inputs.platforms }}

  build:
    name: build ${{ matrix.variant }} (${{ matrix.os_id }}-${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.execution == 'native' || inputs.execution == 'both'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AOT runners resolve independently from the standard JVM runner. The
          # legacy variables remain fallbacks while repositories migrate.
          - runner: ${{ vars.KOMPILE_AOT_LINUX_X64_RUNNER || vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
            os_id: linux
            arch: x86_64
            variant: cli-only
          - runner: ${{ vars.KOMPILE_AOT_MACOS_ARM64_RUNNER || vars.KOMPILE_MACOS_ARM64_RUNNER || 'macos-14' }}   # Apple Silicon
            os_id: macosx
            arch: arm64
            variant: cli-only
          - runner: ${{ vars.KOMPILE_AOT_WINDOWS_X64_RUNNER || vars.KOMPILE_WINDOWS_X64_RUNNER || 'windows-latest' }}
            os_id: windows
            arch: x86_64
            variant: cli-only
          # Enable once you have arm64 Linux runners:
          # - runner: ubuntu-24.04-arm
          #   os_id: linux
          #   arch: arm64
          #   variant: cli-only

    steps:
      - name: Select requested native platform
        id: platform
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SELECTED=true
          else
            REQUESTED=",${{ inputs.platforms }},"
            REQUESTED="${REQUESTED//[[:space:]]/}"
            CANDIDATE=",${{ matrix.os_id }}-${{ matrix.arch }},"
            if [[ "${REQUESTED}" == *"${CANDIDATE}"* ]]; then
              SELECTED=true
            else
              SELECTED=false
            fi
          fi
          echo "selected=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "Native platform ${{ matrix.os_id }}-${{ matrix.arch }} selected: ${SELECTED}"

      - name: Verify AOT runner capacity
        if: steps.platform.outputs.selected == 'true'
        shell: bash
        run: |
          TOTAL_GIB="$(node -e "console.log(Math.floor(require('os').totalmem() / 1024 / 1024 / 1024))")"
          echo "AOT runner memory: ${TOTAL_GIB} GiB"
          if [ "${TOTAL_GIB}" -lt 30 ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
                && [ "${{ inputs.allow_constrained_aot }}" = "true" ]; then
              echo "::warning::Running an explicitly requested constrained AOT trial below 32 GiB; the job may OOM."
            else
              echo "ERROR: AOT release builds require a runner with at least 32 GiB RAM." >&2
              echo "Configure the matching KOMPILE_AOT_*_RUNNER repository variable or explicitly allow a constrained manual trial." >&2
              exit 1
            fi
          fi

      - name: Checkout
        if: steps.platform.outputs.selected == 'true'
        uses: actions/checkout@v4

      - name: Set up GraalVM ${{ env.GRAALVM_JAVA_VERSION }}
        if: steps.platform.outputs.selected == 'true'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'

      - name: Resolve version
        id: ver
        if: steps.platform.outputs.selected == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          if [[ ! "${V}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid release version: ${V}" >&2
            exit 2
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Set reactor release version
        if: steps.platform.outputs.selected == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          mvn -B -ntp -N org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
            -Dproperty=project.version \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false
          mvn -B -ntp -N org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
            -Dproperty=anserini.version \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Build CLI native image
        if: steps.platform.outputs.selected == 'true' && (github.event_name == 'push' || inputs.aot_probe_target == 'cli')
        shell: bash
        # Install the upstream Java reactor first. Applying -Dkompile.dist to -am
        # would activate every upstream native profile and AOT-build unrelated
        # pipeline/service images before the CLI.
        # Then activate the native profile only in cli-main, matching build-dist.sh.
        run: |
          mvn -B -ntp -DskipTests \
            -Dnd4j.version="${ND4J_VERSION}" \
            -Ddl4j.repository.id="${DL4J_MAVEN_REPOSITORY_ID}" \
            -Ddl4j.repository.url="${DL4J_MAVEN_REPOSITORY_URL}" \
            -pl kompile-cli/kompile-cli-main -am \
            clean install

          mvn -B -ntp -f kompile-cli/kompile-cli-main/pom.xml \
            -Dkompile.dist=true -Dnative.quickBuild=false -DskipTests \
            -Dnd4j.version="${ND4J_VERSION}" \
            -Ddl4j.repository.id="${DL4J_MAVEN_REPOSITORY_ID}" \
            -Ddl4j.repository.url="${DL4J_MAVEN_REPOSITORY_URL}" \
            package

      - name: Build app native image memory probe
        if: steps.platform.outputs.selected == 'true' && github.event_name == 'workflow_dispatch' && inputs.aot_probe_target == 'app'
        shell: bash
        run: |
          mvn -B -ntp -DskipTests \
            -Dnd4j.version="${ND4J_VERSION}" \
            -Ddl4j.repository.id="${DL4J_MAVEN_REPOSITORY_ID}" \
            -Ddl4j.repository.url="${DL4J_MAVEN_REPOSITORY_URL}" \
            -pl kompile-app/kompile-app-parent/kompile-app-main -am \
            clean install

          mvn -B -ntp -f kompile-app/kompile-app-parent/kompile-app-main/pom.xml \
            -Dkompile.dist=true -Dkompile.uber -Dnative.quickBuild=false -DskipTests \
            -Dnd4j.version="${ND4J_VERSION}" \
            -Ddl4j.repository.id="${DL4J_MAVEN_REPOSITORY_ID}" \
            -Ddl4j.repository.url="${DL4J_MAVEN_REPOSITORY_URL}" \
            package

      - name: Install Linux packaging tools
        if: steps.platform.outputs.selected == 'true' && (github.event_name == 'push' || inputs.aot_probe_target == 'cli') && matrix.os_id == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Assemble canonical distribution archives
        id: pkg
        if: steps.platform.outputs.selected == 'true' && (github.event_name == 'push' || inputs.aot_probe_target == 'cli')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          PLATFORM="${{ matrix.os_id }}-${{ matrix.arch }}"
          NAME="kompile-dist-${VERSION}-${VARIANT}-${PLATFORM}"
          OUTPUT_DIR="${PWD}/release-dist"

          # Reuse the installed CLI native image and build the sibling model CLI
          # at release optimization. The canonical builder owns layout, metadata,
          # manifests, archives, and platform-specific executable naming.
          export MAVEN_OPTS="${MAVEN_OPTS:-} -Dnative.quickBuild=false"
          DIST_ARGS=(
            "${VARIANT}"
            --skip-java-build
            --skip-maven-install
            --version "${VERSION}"
            --platform "${PLATFORM}"
            --output-dir "${OUTPUT_DIR}"
          )
          ./build-dist.sh "${DIST_ARGS[@]}"

          cp "${OUTPUT_DIR}/${NAME}.zip" "${NAME}.zip"
          cp "${OUTPUT_DIR}/${NAME}.zip.sha256" "${NAME}.zip.sha256"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz" "${NAME}.tar.gz"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz.sha256" "${NAME}.tar.gz.sha256"

          echo "archive=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "compatibility_archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          RELEASE_FILES=(
            "${NAME}.zip" "${NAME}.zip.sha256"
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
          )
          ls -lh "${RELEASE_FILES[@]}"

      - name: Upload build artifacts
        if: steps.platform.outputs.selected == 'true' && (github.event_name == 'push' || inputs.aot_probe_target == 'cli')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
            ${{ steps.pkg.outputs.compatibility_archive }}
            ${{ steps.pkg.outputs.compatibility_archive }}.sha256
          if-no-files-found: error

  # ── JVM distribution: shaded/exec JARs + jlink runtime on a standard runner ──
  full-dist-linux:
    name: build full JVM (linux-x86_64)
    if: github.event_name == 'push'
    runs-on: ${{ vars.KOMPILE_JAVA_RUNNER || 'ubuntu-22.04' }}
    env:
      DL4J_MAVEN_USERNAME: ${{ secrets.DL4J_MAVEN_USERNAME }}
      DL4J_MAVEN_PASSWORD: ${{ secrets.DL4J_MAVEN_PASSWORD }}
      MAVEN_OPTS: '-Xmx6g'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: ${{ env.DL4J_MAVEN_REPOSITORY_ID }}
          server-username: DL4J_MAVEN_USERNAME
          server-password: DL4J_MAVEN_PASSWORD

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          if [[ ! "${V}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid release version: ${V}" >&2
            exit 2
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Set reactor release version
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="${VERSION}" \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false
          mvn -B -ntp -N org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
            -Dproperty=project.version \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false
          mvn -B -ntp -N org.codehaus.mojo:versions-maven-plugin:2.18.0:set-property \
            -Dproperty=anserini.version \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Assemble full distribution archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="kompile-dist-${VERSION}-full-linux-x86_64"
          OUTPUT_DIR="${PWD}/release-dist"
          export GRAALVM_HOME="${JAVA_HOME}"
          export KOMPILE_JAVA="${JAVA_HOME}/bin/java"

          # build-dist.sh owns the complete JVM boundary: reactor build, shaded
          # and exec JARs, JBang wrapper, jlink runtime, manifest, and checksums.
          ./build-dist.sh full \
            --jars-only \
            --skip-maven-install \
            --version "${VERSION}" \
            --platform linux-x86_64 \
            --output-dir "${OUTPUT_DIR}"

          cp "${OUTPUT_DIR}/${NAME}.zip" "${NAME}.zip"
          cp "${OUTPUT_DIR}/${NAME}.zip.sha256" "${NAME}.zip.sha256"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz" "${NAME}.tar.gz"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz.sha256" "${NAME}.tar.gz.sha256"

          DIST_ROOT="${OUTPUT_DIR}/${NAME}"
          for asset in kompile-cli.jar kompile-server.jar kompile-chat.jar \
                       kompile-crawl-manager.jar kompile-model-staging.jar; do
            test -f "${DIST_ROOT}/lib/${asset}"
            cp "${DIST_ROOT}/lib/${asset}" "${asset}"
          done

          echo "archive=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "compatibility_archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.zip" "${NAME}.zip.sha256" \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" kompile-*.jar

      - name: Upload full-dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
            ${{ steps.pkg.outputs.compatibility_archive }}
            ${{ steps.pkg.outputs.compatibility_archive }}.sha256
            kompile-cli.jar
            kompile-server.jar
            kompile-chat.jar
            kompile-crawl-manager.jar
            kompile-model-staging.jar
          if-no-files-found: error

  # ── Smoke-test the full-dist archive before publishing ───────────────────
  smoke-full-dist:
    name: Smoke-test full distribution (linux-x86_64)
    needs: full-dist-linux
    runs-on: ${{ vars.KOMPILE_JAVA_RUNNER || 'ubuntu-22.04' }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          if [[ ! "${V}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid release version: ${V}" >&2
            exit 2
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Download full-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kompile-dist-${{ steps.ver.outputs.version }}-full-linux-x86_64.zip
          path: full-dist-download

      - name: Verify and extract complete ZIP to $HOME/.kompile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find full-dist-download -maxdepth 1 -name '*.zip' -print -quit)"
          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: no complete distribution ZIP found in full-dist-download/" >&2
            exit 1
          fi
          CHECKSUM="${ARCHIVE}.sha256"
          test -f "${CHECKSUM}"
          (cd "$(dirname "${ARCHIVE}")" && sha256sum -c "$(basename "${CHECKSUM}")")

          EXTRACTED="${RUNNER_TEMP}/full-dist-extracted"
          rm -rf "${EXTRACTED}"
          mkdir -p "${EXTRACTED}" "$HOME/.kompile"
          unzip -q "${ARCHIVE}" -d "${EXTRACTED}"
          DIST_ROOT="$(find "${EXTRACTED}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ -z "${DIST_ROOT}" ]; then
            echo "ERROR: distribution ZIP has no root directory" >&2
            exit 1
          fi
          cp -a "${DIST_ROOT}/." "$HOME/.kompile/"

          # Attest the internal payload and the JVM execution form.
          (cd "$HOME/.kompile" && sha256sum -c manifest.sha256)
          python3 - "$HOME/.kompile/.dist-info.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          info = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert info["variant"] == "full"
          assert info["components"]["cli"]["native"] is False
          assert info["components"]["cli"]["jar"] is True
          for component in ("server", "chat", "crawl-manager", "model-staging"):
              assert info["components"][component]["jar"] is True, component
          assert info["components"]["bundled-runtime"]["present"] is True
          PY
          echo "Complete ZIP extracted and verified"

      - name: Set permissions
        shell: bash
        run: |
          chmod +x "$HOME/.kompile/bin/"* 2>/dev/null || true
          if [ -d "$HOME/.kompile/runtime/bin" ]; then
            chmod +x "$HOME/.kompile/runtime/bin/"* 2>/dev/null || true
          fi

      - name: Assert kompile --version
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          echo "Testing: kompile --version"
          kompile --version
          echo "kompile --version OK"

      - name: Assert bundled runtime java -version (when present)
        shell: bash
        run: |
          if [ -x "$HOME/.kompile/runtime/bin/java" ]; then
            echo "Testing: runtime/bin/java -version"
            "$HOME/.kompile/runtime/bin/java" -version
            echo "runtime/bin/java OK"
          else
            echo "INFO: no bundled runtime found at $HOME/.kompile/runtime/bin/java — skipping"
          fi

      - name: Assert project init creates expected files
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          PROJ_DIR="$RUNNER_TEMP/smoke-proj"
          mkdir -p "$PROJ_DIR"
          printf '# Smoke test\n\nThis is a smoke test document.\n' > "$PROJ_DIR/README.md"
          echo "Running: kompile project init --root $PROJ_DIR --name smoke --backend local"
          kompile project init --root "$PROJ_DIR" --name smoke --backend local
          for f in kompile.project.json config/project-runtime.json .mcp.json; do
            if [ ! -f "$PROJ_DIR/$f" ]; then
              echo "ERROR: expected file missing: $PROJ_DIR/$f"
              ls -la "$PROJ_DIR/" || true
              exit 1
            fi
            echo "  OK: $f"
          done
          echo "project init assertions passed"

      - name: Smoke-test JVM staging server startup
        shell: bash
        run: |
          set -euo pipefail
          STAGING_LOG="$RUNNER_TEMP/staging-server.log"
          STAGING_LAUNCHER="$HOME/.kompile/bin/kompile-model-staging.sh"
          if [ ! -x "${STAGING_LAUNCHER}" ]; then
            echo "ERROR: required staging launcher is missing: ${STAGING_LAUNCHER}" >&2
            exit 1
          fi

          export KOMPILE_DIST_HOME="$HOME/.kompile"
          export KOMPILE_NATIVE_LIB_DIR="$HOME/.kompile/lib"
          export LD_LIBRARY_PATH="$HOME/.kompile/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"

          echo "Starting JVM staging server on port 18090 (log: ${STAGING_LOG}) ..."
          "${STAGING_LAUNCHER}" \
            --port 18090 \
            --spring.main.web-application-type=servlet \
            >> "${STAGING_LOG}" 2>&1 &
          STAGING_PID=$!
          echo "Staging server PID: ${STAGING_PID}"

          # There is no Spring Actuator in this application. Poll the staging
          # MCP status endpoint for up to 90 seconds.
          DEADLINE=$(( $(date +%s) + 90 ))
          HEALTHY=false
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' \
              http://localhost:18090/mcp/status 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              HEALTHY=true
              echo "Staging server healthy (HTTP 200)"
              break
            fi
            if ! kill -0 "${STAGING_PID}" 2>/dev/null; then
              echo "ERROR: staging server process exited prematurely"
              cat "${STAGING_LOG}" || true
              exit 1
            fi
            sleep 3
          done

          # Terminate the server
          kill "${STAGING_PID}" 2>/dev/null || true
          wait "${STAGING_PID}" 2>/dev/null || true

          if [ "${HEALTHY}" = false ]; then
            echo "ERROR: staging server did not become healthy within 90s"
            exit 1
          fi
          echo "Staging server smoke test passed"

      - name: Upload staging server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-staging-log
          path: ${{ runner.temp }}/staging-server.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [java-distributions, build, full-dist-linux, smoke-full-dist]
    runs-on: ${{ vars.KOMPILE_RELEASE_RUNNER || 'ubuntu-22.04' }}
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' || inputs.publish)
    environment: release
    steps:
      - name: Verify manual release tag targets this branch commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha 2>/dev/null || true)"
          if [ -n "${EXISTING_SHA}" ] && [ "${EXISTING_SHA}" != "${GITHUB_SHA}" ]; then
            echo "ERROR: ${RELEASE_TAG} already targets ${EXISTING_SHA}, not selected commit ${GITHUB_SHA}." >&2
            echo "Choose a new version; release publication never moves an existing tag." >&2
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}

