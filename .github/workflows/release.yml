# ──────────────────────────────────────────────────────────────────────────────
# Kompile release pipeline
#
# Builds the cross-platform `kompile` CLI as a GraalVM native image, packages it
# through the canonical complete-distribution builder, generates SHA-256
# checksums, and publishes a GitHub Release. ZIP is the primary release and Maven
# artifact on every platform; tar.gz remains available for installer compatibility.
#
# Archive naming (must match install.sh + docs/getting-started/installation.md):
#   kompile-dist-<version>-<variant>-<os>-<arch>.zip
#   kompile-dist-<version>-<variant>-<os>-<arch>.tar.gz
#     os   ∈ { linux, macosx, windows }
#     arch ∈ { x86_64, arm64 }
#
# ⚠️  RUNNER SIZING — READ THIS FIRST
#   The CLI native-image build passes `-J-Xmx18g`
#   (kompile-cli/kompile-cli-main/pom.xml). It will OOM on standard GitHub-hosted
#   runners (16 GB). Point the `runner` matrix values at machines with ≥ 32 GB RAM
#   (GitHub "larger runners" or self-hosted) by setting these repository variables
#   (Settings -> Secrets and variables -> Actions -> Variables):
#       KOMPILE_LINUX_X64_RUNNER     (default: ubuntu-latest)
#       KOMPILE_MACOS_ARM64_RUNNER   (default: macos-14)
#       KOMPILE_WINDOWS_X64_RUNNER   (default: windows-latest)
#       KOMPILE_RELEASE_RUNNER       (default: ubuntu-latest; lightweight, no native build)
#       DL4J_SDK_ASSETS_URL          (required for the complete Linux full ZIP)
#       DL4J_MAVEN_REPOSITORY_URL    (optional repository containing the matching DL4J build)
#       DL4J_MAVEN_REPOSITORY_ID     (default: dl4j-release)
#       DL4J_VERSION                 (optional published DL4J version; defaults to the POM)
#   Until you set the runner variables, the defaults run on standard hosted runners and the native
#   build step is expected to OOM.
#
# Variants:
#   This workflow publishes cross-platform `cli-only` archives and the canonical
#   Linux `full` archive (CLI native + service JARs + Java runtime + DL4J SDK).
#   Native CPU/GPU service variants remain self-hosted builds produced through
#   build-dist.sh; they must use the same release job when enabled.
# ──────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.1.0'
        required: true
        default: '0.0.0-dev'
      dl4j_sdk_assets_url:
        description: 'Verified linux-x86_64 DL4J sdk-assets archive URL (defaults to repository variable DL4J_SDK_ASSETS_URL)'
        required: false
        default: ''

permissions:
  contents: write          # needed to create the GitHub Release

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  cancel-in-progress: false

env:
  GRAALVM_JAVA_VERSION: '21'

jobs:
  build:
    name: build ${{ matrix.variant }} (${{ matrix.os_id }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `runner` resolves from a repo variable, falling back to a hosted runner.
          # Set the variables (see header) to ≥ 32 GB / self-hosted labels.
          - runner: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
            os_id: linux
            arch: x86_64
            variant: cli-only
          - runner: ${{ vars.KOMPILE_MACOS_ARM64_RUNNER || 'macos-14' }}   # Apple Silicon
            os_id: macosx
            arch: arm64
            variant: cli-only
          - runner: ${{ vars.KOMPILE_WINDOWS_X64_RUNNER || 'windows-latest' }}
            os_id: windows
            arch: x86_64
            variant: cli-only
          # Enable once you have arm64 Linux runners:
          # - runner: ubuntu-24.04-arm
          #   os_id: linux
          #   arch: arm64
          #   variant: cli-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM ${{ env.GRAALVM_JAVA_VERSION }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Build CLI native image
        shell: bash
        # -Dkompile.dist=true activates the `native` profile (see cli-main pom).
        # -am builds the CLI's upstream reactor dependencies from a clean checkout
        #     (the local "no -am" rule assumes deps are already installed).
        # -DskipTests skips the slow native test execution.
        run: |
          mvn -B -ntp -Dkompile.dist=true -DskipTests \
            -pl kompile-cli/kompile-cli-main -am \
            clean package

      - name: Install Linux packaging tools
        if: matrix.os_id == 'linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Assemble canonical distribution archives
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          PLATFORM="${{ matrix.os_id }}-${{ matrix.arch }}"
          NAME="kompile-dist-${VERSION}-${VARIANT}-${PLATFORM}"
          OUTPUT_DIR="${PWD}/release-dist"

          # Reuse the native image built above. The canonical builder owns the
          # layout, metadata, internal manifest, ZIP, compatibility tarball, and
          # platform-specific executable naming.
          DIST_ARGS=(
            "${VARIANT}"
            --skip-java-build
            --skip-maven-install
            --version "${VERSION}"
            --platform "${PLATFORM}"
            --output-dir "${OUTPUT_DIR}"
          )
          ./build-dist.sh "${DIST_ARGS[@]}"

          cp "${OUTPUT_DIR}/${NAME}.zip" "${NAME}.zip"
          cp "${OUTPUT_DIR}/${NAME}.zip.sha256" "${NAME}.zip.sha256"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz" "${NAME}.tar.gz"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz.sha256" "${NAME}.tar.gz.sha256"

          echo "archive=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "compatibility_archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          RELEASE_FILES=(
            "${NAME}.zip" "${NAME}.zip.sha256"
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"
          )
          ls -lh "${RELEASE_FILES[@]}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
            ${{ steps.pkg.outputs.compatibility_archive }}
            ${{ steps.pkg.outputs.compatibility_archive }}.sha256
          if-no-files-found: error

  # ── Full distribution: CLI native + service JARs + jlink runtime + DL4J SDK ──
  full-dist-linux:
    name: build full (linux-x86_64)
    runs-on: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
    env:
      DL4J_MAVEN_REPOSITORY_URL: ${{ vars.DL4J_MAVEN_REPOSITORY_URL }}
      DL4J_MAVEN_REPOSITORY_ID: ${{ vars.DL4J_MAVEN_REPOSITORY_ID || 'dl4j-release' }}
      ND4J_VERSION: ${{ vars.DL4J_VERSION }}
      DL4J_MAVEN_USERNAME: ${{ secrets.DL4J_MAVEN_USERNAME }}
      DL4J_MAVEN_PASSWORD: ${{ secrets.DL4J_MAVEN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21 (for jlink runtime + jar builds)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          server-id: ${{ env.DL4J_MAVEN_REPOSITORY_ID }}
          server-username: DL4J_MAVEN_USERNAME
          server-password: DL4J_MAVEN_PASSWORD

      - name: Remember Temurin home
        shell: bash
        run: echo "TEMURIN_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up GraalVM ${{ env.GRAALVM_JAVA_VERSION }} (for CLI native image)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'

      - name: Remember GraalVM home
        shell: bash
        run: echo "GRAALVM_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Build CLI native image (GraalVM)
        shell: bash
        run: |
          mvn -B -ntp -Dkompile.dist=true -DskipTests \
            -pl kompile-cli/kompile-cli-main -am \
            clean package

      - name: Build all service exec jars with UI (Temurin)
        shell: bash
        run: |
          export JAVA_HOME="${TEMURIN_HOME}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          # No -Dkompile.dist here: this is the jar tier, not a native-image build.
          # app-main includes the Angular UI because -Dskip.ui is intentionally absent.
          MAVEN_REPOSITORY_ARGS=()
          if [ -n "${DL4J_MAVEN_REPOSITORY_URL}" ]; then
            MAVEN_REPOSITORY_ARGS+=(
              "-Ddl4j.repository.id=${DL4J_MAVEN_REPOSITORY_ID}"
              "-Ddl4j.repository.url=${DL4J_MAVEN_REPOSITORY_URL}"
            )
          fi
          if [ -n "${ND4J_VERSION}" ]; then
            MAVEN_REPOSITORY_ARGS+=("-Dnd4j.version=${ND4J_VERSION}")
          fi
          mvn -B -ntp -DskipTests -Dkompile.uber -Dnd4j.backend=nd4j-native \
            "${MAVEN_REPOSITORY_ARGS[@]}" \
            -pl :kompile-app-main,:kompile-app-chat,:kompile-app-crawl-manager,:kompile-model-staging \
            -am package

      - name: Download and verify matching DL4J SDK assets
        id: dl4j_sdk
        shell: bash
        env:
          SDK_URL: ${{ inputs.dl4j_sdk_assets_url || vars.DL4J_SDK_ASSETS_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_URL}" ]; then
            echo "ERROR: set workflow input dl4j_sdk_assets_url or repository variable DL4J_SDK_ASSETS_URL" >&2
            exit 1
          fi

          DOWNLOAD_DIR="${RUNNER_TEMP}/dl4j-sdk-download"
          SDK_ROOT="${RUNNER_TEMP}/dl4j-sdk-assets"
          mkdir -p "${DOWNLOAD_DIR}" "${SDK_ROOT}"
          ARCHIVE="${DOWNLOAD_DIR}/sdk-assets.archive"
          CHECKSUM="${ARCHIVE}.sha256"
          curl --fail --location --retry 3 "${SDK_URL}" --output "${ARCHIVE}"
          curl --fail --location --retry 3 "${SDK_URL}.sha256" --output "${CHECKSUM}"

          EXPECTED="$(awk '{print tolower($1)}' "${CHECKSUM}")"
          ACTUAL="$(sha256sum "${ARCHIVE}" | awk '{print $1}')"
          if [[ ! "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]] || [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "ERROR: DL4J SDK checksum mismatch: expected=${EXPECTED} actual=${ACTUAL}" >&2
            exit 1
          fi

          python3 - "${ARCHIVE}" "${SDK_ROOT}" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys

          driver = Path("release/aws/build-platform.py")
          spec = importlib.util.spec_from_file_location("kompile_release_build_platform", driver)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          destination = Path(sys.argv[2])
          module.extract_sdk_archive(Path(sys.argv[1]), destination)
          module.validate_sdk_assets(destination, "GitHub release DL4J SDK archive")
          PY
          echo "path=${SDK_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Install Linux packaging tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Assemble full distribution archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="kompile-dist-${VERSION}-full-linux-x86_64"
          OUTPUT_DIR="${PWD}/release-dist"
          export JAVA_HOME="${GRAALVM_HOME}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          export KOMPILE_JAVA="${TEMURIN_HOME}/bin/java"

          # build-dist.sh owns the layout, jlink runtime, complete DL4J SDK,
          # internal manifest, checksums, and ELF portability policy.
          ./build-dist.sh full \
            --skip-java-build \
            --skip-maven-install \
            --version "${VERSION}" \
            --platform linux-x86_64 \
            --sdx-assets "${{ steps.dl4j_sdk.outputs.path }}" \
            --output-dir "${OUTPUT_DIR}"

          cp "${OUTPUT_DIR}/${NAME}.zip" "${NAME}.zip"
          cp "${OUTPUT_DIR}/${NAME}.zip.sha256" "${NAME}.zip.sha256"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz" "${NAME}.tar.gz"
          cp "${OUTPUT_DIR}/${NAME}.tar.gz.sha256" "${NAME}.tar.gz.sha256"

          DIST_ROOT="${OUTPUT_DIR}/${NAME}"
          for asset in kompile-cli.jar kompile-server.jar kompile-chat.jar \
                       kompile-crawl-manager.jar kompile-model-staging.jar; do
            test -f "${DIST_ROOT}/lib/${asset}"
            cp "${DIST_ROOT}/lib/${asset}" "${asset}"
          done

          echo "archive=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "compatibility_archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.zip" "${NAME}.zip.sha256" \
            "${NAME}.tar.gz" "${NAME}.tar.gz.sha256" kompile-*.jar

      - name: Upload full-dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
            ${{ steps.pkg.outputs.compatibility_archive }}
            ${{ steps.pkg.outputs.compatibility_archive }}.sha256
            kompile-cli.jar
            kompile-server.jar
            kompile-chat.jar
            kompile-crawl-manager.jar
            kompile-model-staging.jar
          if-no-files-found: error

  # ── Smoke-test the full-dist archive before publishing ───────────────────
  smoke-full-dist:
    name: Smoke-test full distribution (linux-x86_64)
    needs: full-dist-linux
    runs-on: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Download full-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kompile-dist-${{ steps.ver.outputs.version }}-full-linux-x86_64.zip
          path: full-dist-download

      - name: Verify and extract complete ZIP to $HOME/.kompile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find full-dist-download -maxdepth 1 -name '*.zip' -print -quit)"
          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: no complete distribution ZIP found in full-dist-download/" >&2
            exit 1
          fi
          CHECKSUM="${ARCHIVE}.sha256"
          test -f "${CHECKSUM}"
          (cd "$(dirname "${ARCHIVE}")" && sha256sum -c "$(basename "${CHECKSUM}")")

          EXTRACTED="${RUNNER_TEMP}/full-dist-extracted"
          rm -rf "${EXTRACTED}"
          mkdir -p "${EXTRACTED}" "$HOME/.kompile"
          unzip -q "${ARCHIVE}" -d "${EXTRACTED}"
          DIST_ROOT="$(find "${EXTRACTED}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          if [ -z "${DIST_ROOT}" ]; then
            echo "ERROR: distribution ZIP has no root directory" >&2
            exit 1
          fi
          cp -a "${DIST_ROOT}/." "$HOME/.kompile/"

          # Attest the internal payload and the complete DL4J companion shard.
          (cd "$HOME/.kompile" && sha256sum -c manifest.sha256)
          test -n "$(find "$HOME/.kompile/sdx-sdk" -type f \( -name '*.zip' -o -name '*.aar' \) -print -quit)"
          test -n "$(find "$HOME/.kompile/sdx-sdk/jars" -type f -name '*.jar' -print -quit)"
          echo "Complete ZIP extracted and verified"

      - name: Set permissions
        shell: bash
        run: |
          chmod +x "$HOME/.kompile/bin/"* 2>/dev/null || true
          if [ -d "$HOME/.kompile/runtime/bin" ]; then
            chmod +x "$HOME/.kompile/runtime/bin/"* 2>/dev/null || true
          fi

      - name: Assert kompile --version
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          echo "Testing: kompile --version"
          kompile --version
          echo "kompile --version OK"

      - name: Assert bundled runtime java -version (when present)
        shell: bash
        run: |
          if [ -x "$HOME/.kompile/runtime/bin/java" ]; then
            echo "Testing: runtime/bin/java -version"
            "$HOME/.kompile/runtime/bin/java" -version
            echo "runtime/bin/java OK"
          else
            echo "INFO: no bundled runtime found at $HOME/.kompile/runtime/bin/java — skipping"
          fi

      - name: Assert project init creates expected files
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          PROJ_DIR="$RUNNER_TEMP/smoke-proj"
          mkdir -p "$PROJ_DIR"
          printf '# Smoke test\n\nThis is a smoke test document.\n' > "$PROJ_DIR/README.md"
          echo "Running: kompile project init --root $PROJ_DIR --name smoke --backend local"
          kompile project init --root "$PROJ_DIR" --name smoke --backend local
          for f in kompile.project.json config/project-runtime.json .mcp.json; do
            if [ ! -f "$PROJ_DIR/$f" ]; then
              echo "ERROR: expected file missing: $PROJ_DIR/$f"
              ls -la "$PROJ_DIR/" || true
              exit 1
            fi
            echo "  OK: $f"
          done
          echo "project init assertions passed"

      - name: Smoke-test staging server startup
        shell: bash
        run: |
          set -euo pipefail
          STAGING_LOG="$RUNNER_TEMP/staging-server.log"
          STAGING_JAR="$HOME/.kompile/lib/kompile-model-staging.jar"
          if [ ! -f "${STAGING_JAR}" ]; then
            echo "INFO: ${STAGING_JAR} not found in dist — skipping staging server smoke test"
            exit 0
          fi

          # Prefer the bundled runtime java; fall back to system java
          if [ -x "$HOME/.kompile/runtime/bin/java" ]; then
            JAVA="$HOME/.kompile/runtime/bin/java"
          else
            JAVA="java"
          fi
          echo "Java: $("${JAVA}" -version 2>&1 | head -1)"

          echo "Starting staging server on port 18090 (log: ${STAGING_LOG}) ..."
          "${JAVA}" -jar "${STAGING_JAR}" \
            --server.port=18090 \
            --spring.main.web-application-type=servlet \
            >> "${STAGING_LOG}" 2>&1 &
          STAGING_PID=$!
          echo "Staging server PID: ${STAGING_PID}"

          # Poll /actuator/health for up to 90s
          DEADLINE=$(( $(date +%s) + 90 ))
          HEALTHY=false
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' \
              http://localhost:18090/actuator/health 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              HEALTHY=true
              echo "Staging server healthy (HTTP 200)"
              break
            fi
            if ! kill -0 "${STAGING_PID}" 2>/dev/null; then
              echo "ERROR: staging server process exited prematurely"
              cat "${STAGING_LOG}" || true
              exit 1
            fi
            sleep 3
          done

          # Terminate the server
          kill "${STAGING_PID}" 2>/dev/null || true
          wait "${STAGING_PID}" 2>/dev/null || true

          if [ "${HEALTHY}" = false ]; then
            echo "ERROR: staging server did not become healthy within 90s"
            exit 1
          fi
          echo "Staging server smoke test passed"

      - name: Upload staging server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-staging-log
          path: ${{ runner.temp }}/staging-server.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build, full-dist-linux, smoke-full-dist]
    runs-on: ${{ vars.KOMPILE_RELEASE_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'push'        # tags publish; manual dispatch only builds
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

# ──────────────────────────────────────────────────────────────────────────────
# Template: hosted / GPU variants (needs a dedicated or self-hosted runner)
#
#   build-hosted:
#     name: build hosted (${{ matrix.os_id }}-${{ matrix.arch }})
#     runs-on: [self-hosted, linux, x64, gpu]   # your capable runner labels
#     strategy:
#       fail-fast: false
#       matrix:
#         include:
#           - os_id: linux
#             arch: x86_64
#             variant: cuda            # or: hosted | cpu-intel | amd-zluda
#     steps:
#       - uses: actions/checkout@v4
#       - uses: graalvm/setup-graalvm@v1
#         with: { java-version: '21', distribution: 'graalvm-community' }
#       # Build through the canonical variant orchestrator. It stages side-loaded
#       # libraries and enforces the same ELF contract used by the Maven assembly.
#       - run: ./build-dist.sh cuda --version "${GITHUB_REF_NAME#v}"
#       # Upload the emitted archive + checksum as build artifacts and add this job
#       # to release.needs; the release job remains the sole GitHub Release writer.
# ──────────────────────────────────────────────────────────────────────────────
