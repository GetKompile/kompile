# ──────────────────────────────────────────────────────────────────────────────
# Kompile release pipeline
#
# Builds the cross-platform `kompile` CLI as a GraalVM native image, packages it
# into the canonical distribution archive, generates a SHA-256 checksum, and
# publishes a GitHub Release. The published archives are exactly what
# `install.sh` (curl -fsSL https://get.kompile.ai/install.sh | bash) downloads.
#
# Archive naming (must match install.sh + docs/getting-started/installation.md):
#   kompile-dist-<version>-<variant>-<os>-<arch>.<ext>
#     os   ∈ { linux, macosx, windows }
#     arch ∈ { x86_64, arm64 }
#     ext  =  tar.gz (linux/macOS) | zip (windows)
#
# ⚠️  RUNNER SIZING — READ THIS FIRST
#   The CLI native-image build passes `-J-Xmx18g`
#   (kompile-cli/kompile-cli-main/pom.xml). It will OOM on standard GitHub-hosted
#   runners (16 GB). Point the `runner` matrix values at machines with ≥ 32 GB RAM
#   (GitHub "larger runners" or self-hosted) by setting these repository variables
#   (Settings -> Secrets and variables -> Actions -> Variables):
#       KOMPILE_LINUX_X64_RUNNER     (default: ubuntu-latest)
#       KOMPILE_MACOS_ARM64_RUNNER   (default: macos-14)
#       KOMPILE_WINDOWS_X64_RUNNER   (default: windows-latest)
#       KOMPILE_RELEASE_RUNNER       (default: ubuntu-latest; lightweight, no native build)
#   Until you set them, the defaults run on standard hosted runners and the native
#   build step is expected to OOM.
#
# Variants:
#   This workflow builds the `cli-only` variant (just the `kompile` binary; the
#   app-main backend is fetched on demand at runtime via `kompile install
#   kompile-app`). The heavier `hosted` variant (CLI + the ~1.9 GB app-main
#   native image, ~22 min) and GPU variants (`cuda`, `amd-zluda`) need a
#   dedicated/self-hosted runner — see the commented `build-hosted` job at the
#   bottom for the template.
# ──────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.1.0'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write          # needed to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRAALVM_JAVA_VERSION: '21'

jobs:
  build:
    name: build ${{ matrix.variant }} (${{ matrix.os_id }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `runner` resolves from a repo variable, falling back to a hosted runner.
          # Set the variables (see header) to ≥ 32 GB / self-hosted labels.
          - runner: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
            os_id: linux
            arch: x86_64
            variant: cli-only
            ext: tar.gz
          - runner: ${{ vars.KOMPILE_MACOS_ARM64_RUNNER || 'macos-14' }}   # Apple Silicon
            os_id: macosx
            arch: arm64
            variant: cli-only
            ext: tar.gz
          - runner: ${{ vars.KOMPILE_WINDOWS_X64_RUNNER || 'windows-latest' }}
            os_id: windows
            arch: x86_64
            variant: cli-only
            ext: zip
          # Enable once you have arm64 Linux runners:
          # - runner: ubuntu-24.04-arm
          #   os_id: linux
          #   arch: arm64
          #   variant: cli-only
          #   ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM ${{ env.GRAALVM_JAVA_VERSION }}
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Build CLI native image
        shell: bash
        # -Dkompile.dist=true activates the `native` profile (see cli-main pom).
        # -am builds the CLI's upstream reactor dependencies from a clean checkout
        #     (the local "no -am" rule assumes deps are already installed).
        # -DskipTests skips the slow native test execution.
        run: |
          mvn -B -ntp -Dkompile.dist=true -DskipTests \
            -pl kompile-cli/kompile-cli-main -am \
            clean package

      - name: Assemble distribution archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VARIANT="${{ matrix.variant }}"
          OS_ID="${{ matrix.os_id }}"
          ARCH="${{ matrix.arch }}"
          EXT="${{ matrix.ext }}"
          NAME="kompile-dist-${VERSION}-${VARIANT}-${OS_ID}-${ARCH}"
          TOP="kompile-${VERSION}"
          STAGE="staging/${TOP}"
          BIN="kompile-cli/kompile-cli-main/target/kompile-cli-main"

          mkdir -p "${STAGE}/bin"
          if [ "${OS_ID}" = "windows" ]; then
            cp "${BIN}.exe" "${STAGE}/bin/kompile.exe"
          else
            cp "${BIN}" "${STAGE}/bin/kompile"
            chmod +x "${STAGE}/bin/kompile"
          fi
          # Ship the Unix launcher scripts alongside the binary.
          cp kompile-dist/src/main/scripts/*.sh "${STAGE}/bin/" 2>/dev/null || true

          # Archive (single top-level dir; install.sh strips it on extract).
          if [ "${EXT}" = "zip" ]; then
            ( cd staging && 7z a -tzip "../${NAME}.zip" "${TOP}" >/dev/null )
          else
            tar -C staging -czf "${NAME}.tar.gz" "${TOP}"
          fi

          # SHA-256 checksum (sha256sum on Linux/Git-Bash, shasum on macOS).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.${EXT}" > "${NAME}.${EXT}.sha256"
          else
            shasum -a 256 "${NAME}.${EXT}" > "${NAME}.${EXT}.sha256"
          fi

          echo "archive=${NAME}.${EXT}" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.${EXT}" "${NAME}.${EXT}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error

  # ── Full distribution: CLI native + server jar + staging jar + jlink runtime ──
  full-dist-linux:
    name: build full (linux-x86_64)
    runs-on: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM ${{ env.GRAALVM_JAVA_VERSION }} (for CLI native image)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: 'maven'

      - name: Set up Temurin JDK 21 (for jlink runtime + jar builds)
        id: temurin21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Building version ${V}"

      - name: Build CLI native image (GraalVM)
        shell: bash
        env:
          # GraalVM is JAVA_HOME at this point (set up first by graalvm/setup-graalvm).
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: |
          mvn -B -ntp -Dkompile.dist=true -DskipTests \
            -pl kompile-cli/kompile-cli-main -am \
            clean package

      - name: Build server + staging jars with UI (Temurin)
        shell: bash
        env:
          JAVA_HOME: ${{ steps.temurin21.outputs.path }}
        run: |
          # Build kompile-app-main exec jar (includes Angular UI — do NOT pass -Dskip.ui).
          mvn -B -ntp -DskipTests -Dkompile.dist=true -Dkompile.uber \
            -pl kompile-app/kompile-app-parent/kompile-app-main -am \
            clean package
          # Build kompile-model-staging exec jar.
          mvn -B -ntp -DskipTests \
            -pl kompile-app/kompile-models/kompile-model-staging -am \
            clean package

      - name: Build jlink runtime (Temurin)
        id: jlink
        shell: bash
        env:
          TEMURIN_HOME: ${{ steps.temurin21.outputs.path }}
        run: |
          set -euo pipefail
          JLINK="${TEMURIN_HOME}/bin/jlink"
          MODULES="java.se,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.zipfs,jdk.management,jdk.management.agent,jdk.security.auth,jdk.naming.dns,jdk.charsets,jdk.localedata,jdk.httpserver,jdk.jfr"
          DEST="$(pwd)/dist-runtime"
          ok=false
          if "${JLINK}" --add-modules "${MODULES}" --include-locales=en \
              --strip-debug --no-header-files --no-man-pages \
              --compress=zip-6 --output "${DEST}" 2>/tmp/jlink.log; then
            ok=true
          else
            rm -rf "${DEST}"
            if "${JLINK}" --add-modules "${MODULES}" \
                --strip-debug --no-header-files --no-man-pages \
                --compress=zip-6 --output "${DEST}" 2>>/tmp/jlink.log; then
              ok=true
            else
              rm -rf "${DEST}"
              if "${JLINK}" --add-modules "${MODULES}" \
                  --strip-debug --no-header-files --no-man-pages \
                  --compress=2 --output "${DEST}" 2>>/tmp/jlink.log; then
                ok=true
              else
                rm -rf "${DEST}" 2>/dev/null || true
              fi
            fi
          fi
          if [ "${ok}" = true ] && "${DEST}/bin/java" -version 2>/dev/null; then
            echo "runtime-path=${DEST}" >> "$GITHUB_OUTPUT"
            echo "bundled-runtime=true" >> "$GITHUB_OUTPUT"
            echo "jlink runtime built: $("${DEST}/bin/java" -version 2>&1 | head -1)"
          else
            echo "bundled-runtime=false" >> "$GITHUB_OUTPUT"
            echo "WARN: jlink runtime build failed; jar tier will need system JDK"
            cat /tmp/jlink.log || true
          fi

      - name: Assemble full distribution archive
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VARIANT="full"
          OS_ID="linux"
          ARCH="x86_64"
          EXT="tar.gz"
          NAME="kompile-dist-${VERSION}-${VARIANT}-${OS_ID}-${ARCH}"
          TOP="kompile-${VERSION}"
          STAGE="staging-full/${TOP}"

          mkdir -p "${STAGE}/bin" "${STAGE}/lib" \
                   "${STAGE}/data/input_documents/uploads" \
                   "${STAGE}/data/shared_files" \
                   "${STAGE}/data/prompt-templates" \
                   "${STAGE}/data/models/.staging" \
                   "${STAGE}/data/logs" \
                   "${STAGE}/data/tool-definitions" \
                   "${STAGE}/data/folders" \
                   "${STAGE}/data/mcp-servers" \
                   "${STAGE}/data/mcp-bridges" \
                   "${STAGE}/data/pids" \
                   "${STAGE}/anserini/indexes" \
                   "${STAGE}/components" \
                   "${STAGE}/fact-sheets" \
                   "${STAGE}/archives"

          # CLI native binary.
          CLI_BIN="kompile-cli/kompile-cli-main/target/kompile-cli-main"
          if [ -f "${CLI_BIN}" ]; then
            cp "${CLI_BIN}" "${STAGE}/bin/kompile"
            chmod +x "${STAGE}/bin/kompile"
            ln -sf kompile "${STAGE}/bin/kompile-cli"
          fi

          # CLI shaded jar → lib/kompile-cli.jar.
          CLI_JAR=$(find kompile-cli/kompile-cli-main/target -maxdepth 1 -name '*-shaded.jar' 2>/dev/null | head -1)
          if [ -n "${CLI_JAR}" ]; then
            cp "${CLI_JAR}" "${STAGE}/lib/kompile-cli.jar"
          fi

          # Server exec jar → lib/kompile-server.jar.
          SERVER_JAR=$(find kompile-app/kompile-app-parent/kompile-app-main/target \
            -maxdepth 1 \( -name '*-exec.jar' -o -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \) \
            2>/dev/null | grep -v 'original' | head -1)
          if [ -n "${SERVER_JAR}" ]; then
            cp "${SERVER_JAR}" "${STAGE}/lib/kompile-server.jar"
          fi

          # Staging exec jar → lib/kompile-model-staging.jar.
          STAGING_JAR=$(find kompile-app/kompile-models/kompile-model-staging/target \
            -maxdepth 1 \( -name '*-exec.jar' -o -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' \) \
            2>/dev/null | grep -v 'original' | head -1)
          if [ -n "${STAGING_JAR}" ]; then
            cp "${STAGING_JAR}" "${STAGE}/lib/kompile-model-staging.jar"
          fi

          # Bundled jlink runtime.
          RUNTIME_PATH="${{ steps.jlink.outputs.runtime-path }}"
          if [ -n "${RUNTIME_PATH}" ] && [ -d "${RUNTIME_PATH}" ]; then
            cp -a "${RUNTIME_PATH}" "${STAGE}/runtime"
          fi

          # Launcher scripts.
          cp kompile-dist/src/main/scripts/*.sh "${STAGE}/bin/" 2>/dev/null || true
          chmod +x "${STAGE}/bin/"*.sh 2>/dev/null || true

          # JBang catalog + quick-start guide.
          cp kompile-dist/src/main/resources/jbang-catalog.json "${STAGE}/" 2>/dev/null || true
          cp kompile-dist/src/main/resources/JBANG.md "${STAGE}/" 2>/dev/null || true

          # Seed files.
          echo '{"mcpServers":{}}' > "${STAGE}/data/mcp-config.json"
          echo "${VERSION}" > "${STAGE}/.version"
          echo "${VARIANT}" > "${STAGE}/.variant"
          cat > "${STAGE}/.dist-info.json" << EOFJSON
          {
            "version": "${VERSION}",
            "variant": "${VARIANT}",
            "platform": "${OS_ID}-${ARCH}",
            "buildDate": "$(date -Iseconds)",
            "components": {
              "cli": $([ -f "${STAGE}/bin/kompile" ] && echo true || echo false),
              "server": $([ -f "${STAGE}/lib/kompile-server.jar" ] && echo true || echo false),
              "model-staging": $([ -f "${STAGE}/lib/kompile-model-staging.jar" ] && echo true || echo false),
              "bundled-runtime": $([ -d "${STAGE}/runtime" ] && echo true || echo false)
            },
            "backend": "hosted"
          }
          EOFJSON

          # Archive.
          tar -C staging-full -czf "${NAME}.tar.gz" "${TOP}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

          echo "archive=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -lh "${NAME}.tar.gz" "${NAME}.tar.gz.sha256"

      - name: Upload full-dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256
          if-no-files-found: error

  # ── Smoke-test the full-dist archive before publishing ───────────────────
  smoke-full-dist:
    name: Smoke-test full distribution (linux-x86_64)
    needs: full-dist-linux
    runs-on: ${{ vars.KOMPILE_LINUX_X64_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Download full-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: kompile-dist-${{ steps.ver.outputs.version }}-full-linux-x86_64.tar.gz
          path: full-dist-download

      - name: Extract distribution to $HOME/.kompile
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(find full-dist-download -name '*.tar.gz' | head -1)
          if [ -z "${ARCHIVE}" ]; then
            echo "ERROR: no .tar.gz found in full-dist-download/"
            ls -la full-dist-download/ || true
            exit 1
          fi
          echo "Extracting ${ARCHIVE} ..."
          mkdir -p "$HOME/.kompile"
          tar -xzf "${ARCHIVE}" --strip-components=1 -C "$HOME/.kompile"
          echo "Extracted layout:"
          ls -la "$HOME/.kompile/" || true

      - name: Set permissions
        shell: bash
        run: |
          chmod +x "$HOME/.kompile/bin/"* 2>/dev/null || true
          if [ -d "$HOME/.kompile/runtime/bin" ]; then
            chmod +x "$HOME/.kompile/runtime/bin/"* 2>/dev/null || true
          fi

      - name: Assert kompile --version
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          echo "Testing: kompile --version"
          kompile --version
          echo "kompile --version OK"

      - name: Assert bundled runtime java -version (when present)
        shell: bash
        run: |
          if [ -x "$HOME/.kompile/runtime/bin/java" ]; then
            echo "Testing: runtime/bin/java -version"
            "$HOME/.kompile/runtime/bin/java" -version
            echo "runtime/bin/java OK"
          else
            echo "INFO: no bundled runtime found at $HOME/.kompile/runtime/bin/java — skipping"
          fi

      - name: Assert project init creates expected files
        shell: bash
        run: |
          export PATH="$HOME/.kompile/bin:$PATH"
          PROJ_DIR="$RUNNER_TEMP/smoke-proj"
          mkdir -p "$PROJ_DIR"
          printf '# Smoke test\n\nThis is a smoke test document.\n' > "$PROJ_DIR/README.md"
          echo "Running: kompile project init --root $PROJ_DIR --name smoke --backend local"
          kompile project init --root "$PROJ_DIR" --name smoke --backend local
          for f in kompile.project.json config/project-runtime.json .mcp.json; do
            if [ ! -f "$PROJ_DIR/$f" ]; then
              echo "ERROR: expected file missing: $PROJ_DIR/$f"
              ls -la "$PROJ_DIR/" || true
              exit 1
            fi
            echo "  OK: $f"
          done
          echo "project init assertions passed"

      - name: Smoke-test staging server startup
        shell: bash
        run: |
          set -euo pipefail
          STAGING_LOG="$RUNNER_TEMP/staging-server.log"
          STAGING_JAR="$HOME/.kompile/lib/kompile-model-staging.jar"
          if [ ! -f "${STAGING_JAR}" ]; then
            echo "INFO: ${STAGING_JAR} not found in dist — skipping staging server smoke test"
            exit 0
          fi

          # Prefer the bundled runtime java; fall back to system java
          if [ -x "$HOME/.kompile/runtime/bin/java" ]; then
            JAVA="$HOME/.kompile/runtime/bin/java"
          else
            JAVA="java"
          fi
          echo "Java: $("${JAVA}" -version 2>&1 | head -1)"

          echo "Starting staging server on port 18090 (log: ${STAGING_LOG}) ..."
          "${JAVA}" -jar "${STAGING_JAR}" \
            --server.port=18090 \
            --spring.main.web-application-type=servlet \
            >> "${STAGING_LOG}" 2>&1 &
          STAGING_PID=$!
          echo "Staging server PID: ${STAGING_PID}"

          # Poll /actuator/health for up to 90s
          DEADLINE=$(( $(date +%s) + 90 ))
          HEALTHY=false
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' \
              http://localhost:18090/actuator/health 2>/dev/null || echo "000")
            if [ "${HTTP_CODE}" = "200" ]; then
              HEALTHY=true
              echo "Staging server healthy (HTTP 200)"
              break
            fi
            if ! kill -0 "${STAGING_PID}" 2>/dev/null; then
              echo "ERROR: staging server process exited prematurely"
              cat "${STAGING_LOG}" || true
              exit 1
            fi
            sleep 3
          done

          # Terminate the server
          kill "${STAGING_PID}" 2>/dev/null || true
          wait "${STAGING_PID}" 2>/dev/null || true

          if [ "${HEALTHY}" = false ]; then
            echo "ERROR: staging server did not become healthy within 90s"
            exit 1
          fi
          echo "Staging server smoke test passed"

      - name: Upload staging server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-staging-log
          path: ${{ runner.temp }}/staging-server.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: [build, full-dist-linux, smoke-full-dist]
    runs-on: ${{ vars.KOMPILE_RELEASE_RUNNER || 'ubuntu-latest' }}
    if: github.event_name == 'push'        # tags publish; manual dispatch only builds
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload stable-named jar assets
        # Uploads well-known jar names so downstream tooling can reference them
        # without version strings. Searches downloaded dist/ artifacts and workspace.
        # Missing jars are skipped gracefully (jars only present in full builds).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          upload_jar_pattern() {
            local pattern="$1"
            local asset_name="$2"
            local match
            match="$(find dist . -maxdepth 8 -path "${pattern}" 2>/dev/null | head -1)"
            if [ -f "${match}" ]; then
              echo "Uploading ${match} as ${asset_name}"
              gh release upload "${TAG}" "${match}#${asset_name}" --clobber
            else
              echo "Skipping ${asset_name} (no file matched ${pattern})"
            fi
          }
          # Stable-named jars from the full-dist artifact (extracted into dist/).
          upload_jar_pattern "*/lib/kompile-cli.jar"             "kompile-cli.jar"
          upload_jar_pattern "*/lib/kompile-server.jar"          "kompile-server.jar"
          upload_jar_pattern "*/lib/kompile-model-staging.jar"   "kompile-model-staging.jar"
          # Fallback: look in build target dirs if full-dist wasn't included in upload.
          upload_jar_pattern "*/kompile-cli-main/*-shaded.jar"   "kompile-cli.jar"
          upload_jar_pattern "*/kompile-app-main/*-exec.jar"     "kompile-server.jar"
          upload_jar_pattern "*/kompile-model-staging/*-exec.jar" "kompile-model-staging.jar"

# ──────────────────────────────────────────────────────────────────────────────
# Template: hosted / GPU variants (needs a dedicated or self-hosted runner)
#
#   build-hosted:
#     name: build hosted (${{ matrix.os_id }}-${{ matrix.arch }})
#     runs-on: [self-hosted, linux, x64, gpu]   # your capable runner labels
#     strategy:
#       fail-fast: false
#       matrix:
#         include:
#           - os_id: linux
#             arch: x86_64
#             variant: cuda            # or: hosted | cpu-intel | amd-zluda
#             ext: tar.gz
#     steps:
#       - uses: actions/checkout@v4
#       - uses: graalvm/setup-graalvm@v1
#         with: { java-version: '21', distribution: 'graalvm-community' }
#       # Build EVERY native image in the reactor, then run the kompile-dist
#       # assembly. For GPU variants also pass the backend flags, e.g.
#       #   -Plibnd4j-cuda -Dlibnd4j.chip=cuda -Dlibnd4j.compute=86,89
#       - run: mvn -B -ntp -Dkompile.dist=true -DskipTests clean package
#       # The assembly emits kompile-dist/target/kompile-dist-<version>.<ext>;
#       # rename it to kompile-dist-<version>-<variant>-<os>-<arch>.<ext>,
#       # checksum, and upload exactly like the `build` job above.
# ──────────────────────────────────────────────────────────────────────────────
