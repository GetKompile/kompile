# ──────────────────────────────────────────────────────────────────────────────
# Mirror a published Kompile GitHub Release into Cloudflare R2
#
# GitHub Releases stays the install and download source (install.sh). This job
# copies every asset of one published release into DL4J's private R2 bucket:
#
#   dl4j-cache/kompile/releases/<version>/<asset>
#   dl4j-cache/kompile/releases/<version>/manifest.json
#
# Assets stream through the runner one at a time, so disk use is bounded by the
# largest asset. Every download must match the size GitHub lists, and an asset
# with a <asset>.sha256 sidecar must match that digest before it is uploaded.
# A listing then confirms every asset is in the bucket at its release size.
# manifest.json (tag, commit, and name/size/sha256 per asset) is uploaded only
# after that, so its presence means the whole release landed. Objects already
# under the prefix are overwritten, never deleted.
#
# Runs on a GitHub-hosted runner. release.yml, publish-release.yml and
# publish-external-aws-release.yml call it after they change a release; dispatch
# it to backfill an existing one. It uses the repository secrets of the native
# AOT cache, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY, and fails without them.
# ──────────────────────────────────────────────────────────────────────────────
name: Mirror release to R2

on:
  workflow_call:
    inputs:
      tag:
        description: Published canonical release tag (v<version>)
        type: string
        required: true
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to mirror, e.g. v0.1.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror ${{ inputs.tag }} to R2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: mirror-release-to-r2-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Mirror release assets and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          R2_ENDPOINT: https://318204901782458555a243ad96f80e3f.r2.cloudflarestorage.com
          R2_BUCKET: dl4j-cache
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "ERROR: invalid release tag: ${RELEASE_TAG}" >&2
            exit 2
          fi
          PREFIX="kompile/releases/${RELEASE_TAG#v}"

          # Same credential handling as build-common.sh: trim surrounding
          # whitespace, refuse anything else malformed, and hand the keys only to
          # aws, through its environment. Ambient AWS profiles and session tokens
          # never sign an R2 request; the checksum settings match DL4J's R2 client.
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            printf '%s' "${value%"${value##*[![:space:]]}"}"
          }
          KEY_ID="$(trim "${R2_ACCESS_KEY_ID}")"
          SECRET="$(trim "${R2_SECRET_ACCESS_KEY}")"
          unset R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY
          if [ -z "${KEY_ID}" ] || [ -z "${SECRET}" ]; then
            echo "ERROR: R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY must be configured as repository secrets." >&2
            exit 1
          fi
          if [[ "${KEY_ID}${SECRET}" =~ [[:space:][:cntrl:]] ]]; then
            echo "ERROR: the R2 credentials contain embedded whitespace or control characters." >&2
            exit 1
          fi
          r2() (
            unset AWS_PROFILE AWS_DEFAULT_PROFILE AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
            export AWS_ACCESS_KEY_ID="${KEY_ID}" AWS_SECRET_ACCESS_KEY="${SECRET}" \
              AWS_DEFAULT_REGION=auto \
              AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED \
              AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED
            aws --endpoint-url "${R2_ENDPOINT}" "$@"
          )
          aws --version

          WORK="${RUNNER_TEMP}/r2-mirror"
          rm -rf "${WORK}"
          mkdir -p "${WORK}/assets"
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json url,publishedAt,isPrerelease,assets > "${WORK}/release.json"
          COMMIT="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)"
          jq -r '.assets[] | [.name, (.size | tostring)] | @tsv' "${WORK}/release.json" \
            | LC_ALL=C sort > "${WORK}/assets.tsv"

          declare -A SIZE=() DIGEST=()
          NAMES=()
          while IFS=$'\t' read -r NAME BYTES; do
            if [[ "${NAME}" == */* || "${NAME}" == manifest.json ]]; then
              echo "ERROR: release asset ${NAME} cannot be mirrored under ${PREFIX}/." >&2
              exit 1
            fi
            SIZE[${NAME}]="${BYTES}"
            NAMES+=("${NAME}")
          done < "${WORK}/assets.tsv"
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "ERROR: ${RELEASE_TAG} has no assets to mirror." >&2
            exit 1
          fi

          ROWS="${WORK}/rows.tsv"
          : > "${ROWS}"
          for NAME in "${NAMES[@]}"; do
            # A sidecar travels with the asset it describes.
            if [[ "${NAME}" == *.sha256 && -n "${SIZE[${NAME%.sha256}]:-}" ]]; then
              continue
            fi
            FILES=("${NAME}")
            if [ -n "${SIZE[${NAME}.sha256]:-}" ]; then
              FILES+=("${NAME}.sha256")
            fi
            for FILE in "${FILES[@]}"; do
              gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --pattern "${FILE}" --dir "${WORK}/assets"
              BYTES="$(stat -c %s "${WORK}/assets/${FILE}")"
              if [ "${BYTES}" != "${SIZE[${FILE}]}" ]; then
                echo "ERROR: ${FILE} downloaded as ${BYTES} bytes; the release lists ${SIZE[${FILE}]}." >&2
                exit 1
              fi
              DIGEST[${FILE}]="$(sha256sum "${WORK}/assets/${FILE}" | cut -d' ' -f1)"
            done
            if [ "${#FILES[@]}" -eq 2 ]; then
              EXPECTED=""
              LISTED=""
              read -r EXPECTED LISTED < "${WORK}/assets/${NAME}.sha256" || true
              LISTED="${LISTED%$'\r'}"
              LISTED="${LISTED#\*}"
              if [ "${EXPECTED,,}" != "${DIGEST[${NAME}]}" ] || [ "${LISTED##*/}" != "${NAME}" ]; then
                echo "ERROR: ${NAME} does not match ${NAME}.sha256." >&2
                exit 1
              fi
            fi
            for FILE in "${FILES[@]}"; do
              r2 s3 cp "${WORK}/assets/${FILE}" "s3://${R2_BUCKET}/${PREFIX}/${FILE}" \
                --only-show-errors --no-progress
              printf '%s\t%s\t%s\n' "${FILE}" "${SIZE[${FILE}]}" "${DIGEST[${FILE}]}" >> "${ROWS}"
              rm -f "${WORK}/assets/${FILE}"
            done
          done

          # Every asset must be in the bucket at its release size before
          # manifest.json marks the release as mirrored.
          r2 s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "${PREFIX}/" \
            --query 'Contents[].[Key, Size]' --output text > "${WORK}/listing.tsv"
          declare -A REMOTE=()
          while IFS=$'\t' read -r KEY BYTES; do
            if [ "${KEY}" != None ]; then
              REMOTE[${KEY#"${PREFIX}/"}]="${BYTES}"
            fi
          done < "${WORK}/listing.tsv"
          while IFS=$'\t' read -r FILE BYTES _; do
            if [ "${REMOTE[${FILE}]:-missing}" != "${BYTES}" ]; then
              echo "ERROR: ${R2_BUCKET}/${PREFIX}/${FILE} is ${REMOTE[${FILE}]:-missing}, expected ${BYTES} bytes." >&2
              exit 1
            fi
            unset "REMOTE[${FILE}]"
          done < "${ROWS}"
          # A previous mirror's manifest is replaced below.
          unset "REMOTE[manifest.json]"
          for EXTRA in "${!REMOTE[@]}"; do
            echo "::warning::${R2_BUCKET}/${PREFIX}/${EXTRA} is not an asset of ${RELEASE_TAG}; left in place."
          done

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg tag "${RELEASE_TAG}" \
            --arg commit "${COMMIT}" \
            --arg bucket "${R2_BUCKET}" \
            --arg prefix "${PREFIX}" \
            --arg mirrored_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mirrored_by "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --slurpfile release "${WORK}/release.json" \
            --rawfile rows "${ROWS}" \
            '{schema: 1, repository: $repository, tag: $tag, version: ($tag | ltrimstr("v")),
              commit: $commit, release_url: $release[0].url,
              published_at: $release[0].publishedAt, prerelease: $release[0].isPrerelease,
              bucket: $bucket, prefix: $prefix, mirrored_at: $mirrored_at, mirrored_by: $mirrored_by,
              assets: [$rows | split("\n")[] | select(length > 0) | split("\t")
                       | {name: .[0], size: (.[1] | tonumber), sha256: .[2]}]}' \
            > "${WORK}/manifest.json"
          r2 s3 cp "${WORK}/manifest.json" "s3://${R2_BUCKET}/${PREFIX}/manifest.json" \
            --only-show-errors --no-progress
          BYTES="$(stat -c %s "${WORK}/manifest.json")"
          REMOTE_BYTES="$(r2 s3api head-object --bucket "${R2_BUCKET}" --key "${PREFIX}/manifest.json" \
            --query ContentLength --output text)"
          if [ "${REMOTE_BYTES}" != "${BYTES}" ]; then
            echo "ERROR: ${R2_BUCKET}/${PREFIX}/manifest.json is ${REMOTE_BYTES} bytes, expected ${BYTES}." >&2
            exit 1
          fi
          echo "Mirrored ${#NAMES[@]} assets of ${RELEASE_TAG} and manifest.json to ${R2_BUCKET}/${PREFIX}/"
